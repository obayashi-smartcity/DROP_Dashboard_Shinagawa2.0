<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>DROP. Coach — 投稿づくりチャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* =====================================================================
     デザイン（v3.2 UI）
     - 問いと答えを近くに：最後の問いはチャットに、答えは下の「回答シート」に。シートの頭に「何問目・どう答えるか」
     - 選択肢はそろったタイル（2 列・左寄せ・大きな押す面積）。長いことばは 1 行まるごと
     - 主ボタンは 1 つだけ色つき（次へ／投稿文をつくる）。とばす・終えるは同じ場所に控えめに
     - 色：紫＝操作できるもの・選んだもの／黒＝文字／灰＝説明。背景はあたたかい白
  ===================================================================== */
  :root{
    --bg:#f7f6f3; --bg-b:#eeece8; --card:#fff;
    --stroke:#dcd8e3; --stroke-soft:#ebe8ef;
    --text:#1e1b24; --muted:#4f4b57; --dim:#8b8795;
    --rich:#6d4bc3; --rich-2:#a68be0; --rich-soft:#f2edfc; --rich-ink:#4a2f93;
    --ok:#2f6b4a; --ok-soft:#e7f4ec; --warn:#8a5f00; --err:#b3372a;
    --sh-1:0 1px 2px rgba(40,25,80,.06),0 4px 14px rgba(40,25,80,.06);
    --sh-2:0 -8px 30px -12px rgba(40,25,80,.28);
    --font:"Inter","Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
    --dockH:220px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:var(--font);color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  svg{flex:none}
  :focus-visible{outline:3px solid rgba(109,75,195,.45);outline-offset:2px}
  html.big .chat, html.big .dock-head, html.big .dock-scroll, html.big .dock-act, html.big .sheet, html.big .pv-in{zoom:1.15}

  /* ---------- 上部 ---------- */
  .top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--stroke-soft)}
  .appbar-in{max-width:640px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
  .brand{font-weight:900;font-size:18px;letter-spacing:-.4px;line-height:1;white-space:nowrap}
  .brand i{font-style:normal;color:var(--rich)}
  .brand small{display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--dim);margin-top:4px}
  .ringbox{margin-left:auto;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--rich-soft)}
  .ring{position:relative;width:40px;height:40px;flex:none}
  .ring svg{width:40px;height:40px;transform:rotate(-90deg);display:block}
  .ring circle{fill:none;stroke-width:5}
  .ring .rt{stroke:#fff}
  .ring .rf{stroke:var(--rich);stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset .6s ease}
  .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--rich-ink)}
  .ring.done b{font-size:17px}
  .ring.pulse{animation:ringpop .55s ease}
  @keyframes ringpop{40%{transform:scale(1.15)}}
  .ring-lab{font-size:13.5px;font-weight:900;color:var(--rich-ink);line-height:1.15;white-space:nowrap}
  .ring-lab small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
  .icon-btn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .icon-btn:hover{background:var(--bg-b)}
  .icon-btn svg{width:22px;height:22px}
  /* メニュー：右上のポップオーバー */
  .menu{position:absolute;right:12px;top:62px;z-index:40;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(30,20,60,.22);padding:6px;display:flex;flex-direction:column;min-width:240px}
  .menu button{border:none;background:none;text-align:left;padding:13px 14px;border-radius:10px;font-size:15px;font-weight:700;color:var(--text)}
  .menu button:hover{background:var(--rich-soft)}
  .staff-flag{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--warn);padding:3px 7px;border-radius:4px}
  /* いまの投稿（細いバー） */
  .pv{display:block;width:100%;border:none;border-top:1px solid var(--stroke-soft);background:#fff;padding:0;text-align:left}
  .pv-in{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
  .pv-k{font-size:11.5px;font-weight:900;color:#fff;background:var(--rich);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pv-t{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-dots{display:flex;gap:3px}
  .pv-dots i{width:8px;height:8px;border-radius:50%;background:var(--bg-b)}
  .pv-dots i.on{background:var(--rich)}
  .pv-open{font-size:12.5px;font-weight:800;color:var(--rich-ink);white-space:nowrap}
  .pv-open::after{content:" ›"}

  /* ---------- チャット ---------- */
  .chat{max-width:640px;margin:0 auto;padding:16px 14px calc(var(--dockH) + 16px)}
  .msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
  .msg.me{justify-content:flex-end}
  .msg.wide{display:block}
  .msg.new{animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .avatar{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--rich),#9a6fe0);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:2px}
  .avatar i{font-style:normal;opacity:.8}
  .avatar.ai{background:linear-gradient(135deg,#3e2a7a,var(--rich))}
  .bubble{max-width:82%;padding:12px 15px;font-size:16.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;border-radius:20px 20px 20px 6px;background:#fff;box-shadow:var(--sh-1)}
  .msg.me .bubble{background:var(--rich);color:#fff;border-radius:20px 20px 6px 20px;box-shadow:none}
  .msg.me .bubble.muted{background:transparent;color:var(--dim);font-size:13.5px;padding:2px 4px;font-weight:700}
  .msg.me .bubble.photo{padding:0;overflow:hidden;max-width:64%;background:var(--bg-b);border-radius:20px 20px 6px 20px}
  .msg.me .bubble.photo img{display:block;width:100%;max-height:340px;object-fit:cover}
  .msg.me .bubble.photo .nophoto{display:block;padding:16px 18px;color:var(--muted);font-size:14px}
  .bubble .sub{display:block;margin-top:6px;font-size:13.5px;color:var(--muted);white-space:normal;line-height:1.6;font-weight:400}
  .typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px}
  .typing .bubble i{width:7px;height:7px;border-radius:50%;background:var(--rich-2);animation:blink 1.1s infinite}
  .typing .bubble i:nth-child(2){animation-delay:.15s}.typing .bubble i:nth-child(3){animation-delay:.3s}
  .typing .bubble em{font-style:normal;font-size:13.5px;color:var(--muted);margin-left:8px}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* ---------- 投稿文（投稿のプレビュー） ---------- */
  .card{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--sh-1)}
  .card-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .card-hd b{font-size:15px;color:var(--text)}
  .post-label{font-size:12px;font-weight:900;letter-spacing:.5px;color:var(--rich-ink);background:var(--rich-soft);border-radius:999px;padding:4px 10px}
  .post-photo{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-bottom:10px;background:var(--bg-b)}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-b);border-radius:12px;padding:3px;margin-bottom:10px}
  .seg button{border:none;background:none;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:800;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--rich-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card textarea{display:block;width:100%;border:1.5px solid transparent;border-radius:12px;resize:none;font-size:17.5px;line-height:1.8;min-height:140px;outline:none;padding:6px 8px;color:var(--text);background:#fbfaf8}
  .card textarea:focus{border-color:var(--rich);background:#fff}
  .card-foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .card-foot .cnt{font-size:12.5px;color:var(--dim)}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none;margin-left:auto}
  .switch input{width:20px;height:20px;accent-color:var(--rich)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{border:1.5px solid var(--rich-2);background:var(--rich-soft);color:var(--rich-ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
  .tag.off{background:#fff;border-color:var(--stroke);color:var(--dim);text-decoration:line-through}
  .note{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:8px}
  .note.warn{color:var(--warn)}
  .card.staff{border:1.5px dashed var(--warn);box-shadow:none;max-width:100%}
  .card.staff b{color:var(--warn)}
  .card.staff table{width:100%;border-collapse:collapse;font-size:13px}
  .card.staff td{border-top:1px solid var(--stroke-soft);padding:5px 4px;vertical-align:top}
  .card.staff td:first-child{color:var(--dim);white-space:nowrap;width:1%}
  .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px}
  .bars s{display:block;height:8px;background:var(--bg-b);border-radius:4px;overflow:hidden;text-decoration:none}
  .bars s u{display:block;height:100%;background:var(--rich)}
  .card.staff pre{max-height:240px;overflow:auto;background:var(--bg);padding:8px;font-size:11px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
  /* 投稿スタンプ・使いごこち */
  .card.stamp{background:linear-gradient(180deg,#fff,var(--rich-soft))}
  .card.stamp .stamp-n{margin-left:auto;font-weight:900;color:var(--rich-ink);font-size:15px}
  .stamps{display:flex;gap:8px;margin:6px 0 10px}
  .stamps i{width:46px;height:46px;border-radius:50%;border:2px dashed var(--rich-2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;color:#fff;font-size:15px}
  .stamps i.on{background:var(--rich);border:2px solid var(--rich);transform:rotate(-8deg);box-shadow:0 2px 6px rgba(74,47,147,.35)}
  .stamps i.on:last-of-type{animation:stamp .5s ease}
  @keyframes stamp{0%{transform:scale(1.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
  .stamp-msg{margin:0;font-size:15.5px;line-height:1.7;font-weight:700}
  .stamp-ai{margin:8px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
  .stamp-ai span{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--rich);border-radius:4px;padding:1px 6px;margin-right:6px}
  .rate{border-top:1px dashed var(--rich-2);margin-top:12px;padding-top:10px}
  .rate-q{margin:0 0 8px;font-size:14.5px;font-weight:800;color:var(--text)}
  .rate-q small{display:inline-block;margin-left:6px;font-size:11.5px;color:var(--dim);font-weight:700}
  .rate-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .rate-btns button{height:48px;border-radius:12px;border:1.5px solid var(--stroke);background:#fff;font-weight:900;font-size:17px}
  .rate-btns button.on{background:var(--rich);border-color:var(--rich);color:#fff}
  .rate-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
  .rate-sel{margin:8px 0 6px;font-size:13.5px;color:var(--rich-ink);font-weight:800}
  .rate textarea{width:100%;border:1.5px solid var(--stroke);border-radius:12px;padding:8px 10px;font-size:15px;resize:none;background:#fff;min-height:0;line-height:1.5}
  .rate-done{margin:0;font-size:14px;color:var(--rich-ink);font-weight:700}

  /* ---------- 回答シート（下） ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
  .dock-in{pointer-events:auto;max-width:640px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--sh-2);padding:8px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px)}
  .dock-in::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--stroke);margin:0 auto 8px}
  body.editing .dock{display:none}
  .dock-head{flex:none;margin:0 0 10px}
  .q-meta{display:flex;align-items:center;gap:8px;min-height:28px}
  .q-title{font-size:18px;font-weight:800;line-height:1.5;margin-top:6px;color:var(--text);animation:pop .3s ease}
  .q-sub{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:2px}
  .q-step{font-size:12px;font-weight:900;color:var(--rich-ink);background:var(--rich-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .q-step.opt{background:var(--bg-b);color:var(--muted)}
  .q-ins{font-size:13.5px;color:var(--muted);font-weight:700;flex:1;min-width:0}
  .dock-head .lnk{padding:4px 0;min-height:32px;font-size:13px;color:var(--rich-ink)}
  .dock-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 1px 4px}
  .dock-act{flex:none;padding-top:12px}
  .dock-act .row{margin-top:0}
  /* 選択肢：そろったタイル */
  .chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:8px}
  .chip{position:relative;min-height:54px;padding:10px 12px;border:1.5px solid var(--stroke);border-radius:14px;background:#fff;font-size:15.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;text-align:left;line-height:1.35;transition:background .12s,border-color .12s,box-shadow .12s}
  .chip.wide{grid-column:1 / -1}
  .chip:active{transform:scale(.98)}
  .chip.on{border:2px solid var(--rich);background:var(--rich-soft);color:var(--rich-ink);padding:9.5px 11.5px;box-shadow:0 2px 8px rgba(109,75,195,.15)}
  .chip .ord,.chip .ck{margin-left:auto;order:2;display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--rich);color:#fff;font-size:12.5px;font-weight:900;align-items:center;justify-content:center;flex:none}
  .chip.sub{color:var(--muted);border-style:dashed}
  .chip.ai{border-style:dashed;border-color:var(--rich-2)}
  .chip.ai small{display:block;width:max-content;font-size:10.5px;font-weight:900;color:#fff;background:var(--rich-2);border-radius:999px;padding:1px 7px;margin-bottom:3px}
  .chip.ai.on small{background:var(--rich)}
  .chip.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .free{display:block;width:100%;margin-top:8px;min-height:50px;border:1.5px dashed var(--stroke);border-radius:14px;padding:12px 14px;font-size:15.5px;background:#fff;outline:none}
  .free:focus{border-style:solid;border-color:var(--rich)}
  .free::placeholder{color:var(--dim);font-weight:700}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .row.center{justify-content:center}
  .btn{min-height:54px;padding:0 20px;border:none;border-radius:16px;background:var(--rich);color:#fff;font-weight:800;font-size:16.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 4px 12px rgba(109,75,195,.28)}
  .btn svg{width:20px;height:20px}
  .btn:disabled{background:var(--rich-soft);color:var(--rich-2);box-shadow:none;cursor:default}
  .btn.ghost{background:#fff;color:var(--rich-ink);border:1.5px solid var(--rich-2);box-shadow:none}
  .btn.plain{background:var(--bg-b);color:var(--muted);box-shadow:none}
  .btn.sm{min-height:46px;padding:0 16px;font-size:15px}
  .btn.wide{flex:1}
  .btn.full{width:100%}
  .btn.text{background:none;box-shadow:none;color:var(--muted);padding:0 12px;min-width:84px;font-size:15px}
  .lnk{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px 6px;min-height:40px}
  .inrow{position:relative}
  .input{display:block;width:100%;min-height:52px;max-height:160px;border:1.5px solid var(--stroke);border-radius:18px;padding:13px 60px 13px 16px;font-size:17px;line-height:1.5;outline:none;resize:none;background:#fff}
  .input:focus{border-color:var(--rich);box-shadow:0 0 0 4px rgba(109,75,195,.12)}
  .input.sm{min-height:48px;font-size:16px;padding:11px 14px;border-radius:14px}
  .send{position:absolute;right:6px;bottom:6px;width:44px;height:44px;border-radius:14px;border:none;background:var(--rich);color:#fff;display:flex;align-items:center;justify-content:center}
  .send:disabled{background:var(--rich-soft);color:var(--rich-2)}
  .send svg{width:22px;height:22px}
  .lab{font-size:13.5px;font-weight:800;color:var(--muted);margin:12px 0 6px}
  .cnt-sm{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .scale button{height:50px;border-radius:12px;border:1.5px solid var(--stroke);background:#fff;font-weight:800;font-size:16px;padding:0}
  .scale button:active,.scale button.on{background:var(--rich);border-color:var(--rich);color:#fff}
  .scale-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:5px;padding:0 2px}
  .login{display:grid;gap:10px}
  .login .input{padding-right:16px}
  .err{font-size:14px;color:var(--err);min-height:1em}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;color:var(--muted);min-height:54px}
  .spin{width:20px;height:20px;border:2.5px solid var(--rich-soft);border-top-color:var(--rich);border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .hint{font-size:12.5px;color:var(--dim);margin-top:6px}
  /* 写真をえらぶタイル */
  .photo-tile{width:100%;min-height:118px;border:2px dashed var(--rich-2);border-radius:18px;background:var(--rich-soft);color:var(--rich-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .photo-tile svg{width:30px;height:30px}
  .photo-tile b{font-size:17px}
  .photo-tile small{font-size:12.5px;color:var(--muted);font-weight:700}

  /* ---------- トースト・シート ---------- */
  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-10px);background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,30,.5);display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sheet-hd b{font-size:18px}
  .sheet-hd .icon-btn{margin-left:auto}
  .sheet p{margin:0 0 12px;font-size:15px;color:var(--muted);line-height:1.7}
  .draft{border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.85;white-space:pre-wrap;color:var(--text);background:var(--rich-soft)}
  .mat{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}

   - 聞いてから聞く：ひとことを受けて返し、ひとことに書かれた気持ち・人は先に選んでおく。問いの言い方もひとことの話題を使う

  };

function drawToDataUrl(src, w, h, edge, quality) {
  const k = Math.min(1, edge / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
/** 端末の画像ファイルをデコード（EXIF の向きを反映）。createImageBitmap で読めない形式は <img> で再試行 */
async function decodeFile(file) {
  if ("createImageBitmap" in window) {
    try { const b = await createImageBitmap(file, { imageOrientation: "from-image" }); return { el: b, w: b.width, h: b.height, close: () => b.close && b.close() }; }
    catch (e) { /* <img> で再試行 */ }
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode error")); i.src = url; });
    return { el: img, w: img.naturalWidth, h: img.naturalHeight, close: () => URL.revokeObjectURL(url) };
  } catch (e) { URL.revokeObjectURL(url); throw e; }
}
$("file").addEventListener("change", async () => {

/* =====================================================================
   ヒント：ひとことを送った直後に裏で 1 回だけ AI を呼ぶ（待たない）
   - subject：問いの言い方に使う話題（「コーヒーの、どこがおいしかったですか？」）
   - why_options：「どこが？」の問いに「写真から」として出す候補（届いていれば）
===================================================================== */
async function fireHint() {
  if (!CONFIG.HINT_ON || !gasOn() || !S || (S.hint && S.hint.status !== "待ち") || RT.hintBusy) return;
  const g = RT.gen, sid = S.sid, t0 = now();
  RT.hintBusy = true;
  S.hint = { status: "待ち" }; save();
  try {
    if (!getToken(CONFIG.KEYS.TOKEN) && !await autoLogin()) { S.hint = { status: "ログインなし" }; save(); return; }
    const body = { action: "hint", variant: "chat", token: getToken(CONFIG.KEYS.TOKEN), context: { event: CONFIG.EVENT, sample_total: SAMPLES.length }, target: { text: S.ans.text1 } };
    if (PHOTO.imgAi) body.target.image_data = PHOTO.imgAi;
    const res = await post(body, CONFIG.GAS_URL);
    if (g !== RT.gen || !S || S.sid !== sid) return;
    const sec = Math.round((now() - t0) / 100) / 10;
    S.hint = res.ok && res.result ? { status: "OK", cached: !!res.cached, elapsed_sec: sec, ...res.result } : { status: res.code || "ERROR", message: res.message || "", elapsed_sec: sec };
    save();
    if (S.phase === "ask" && S.cur === "why" && !RT.busy) renderDock();   // 「どこが？」を表示中なら候補を足す
    if (S.phase === "ask") renderPreviewBar();
  } finally { RT.hintBusy = false; }
}

/* =====================================================================
   投稿文（自分の言葉の文＝画面で即時に組み立て／AI が整えた文）
===================================================================== */
function composeText() {
  // 自分の言葉の文：見本の流れ（つかみ → 人・ギャップ → どこが → 気づき → 次の一歩）で、本人の答えだけをつなぐ（5〜6 行まで）
  const A = S.ans, t1raw = String(A.text1 || "");
  const head = t1raw.split(/\n/).map(s => s.replace(/[。．]+$/g, "").trim()).filter(Boolean).slice(0, 2);
  const f = firstFeel();
  const t1HasFeel = f && f.key ? new RegExp(f.key).test(t1raw) : false;
  const fill = (tpl, e) => String(tpl || "").replace("{e}", e).replace("{v}", f ? f.v : "");
  // 人とギャップ（「作った人は、ふだんは品川で働く会社員！」）
  const w = whoItem(), people = [];
  const wl = w && w.line ? w.line(A.who.detail, A.who.label) : "";
  const fc = A.face.find(x => !(item("face", x.id) || {}).neutral);
  if (fc) {
    const it = item("face", fc.id), say = it && !it.free ? it.say : fc.label;
    const nm = w && ["otherco", "local"].includes(w.id) ? "話した人" : "作った人";
    if (wl && !(w && ["maker", "otherco", "local"].includes(w.id))) people.push(wl);
    people.push(`${nm}は、${say}！`);
  } else if (wl) people.push(wl);
  // どこが
  const whys = A.why.map(x => x.say || x.label).filter(Boolean).slice(0, 2).join("と");
  let whyLine = "";
  if (whys) whyLine = t1HasFeel ? (f.negative ? `気になったのは${whys}` : `とくに${whys}！`) : f && f.withE ? fill(f.withE, whys) : `印象に残ったのは${whys}`;
  else if (f && !t1HasFeel && f.ex) whyLine = fill(f.ex, "");
  // 気づき（今日の発見）・次の一歩
  const finds = A.find.map(x => { const it = item("find", x.id); if (it && it.neutral) return ""; return it && !it.free ? it.say : x.label; }).filter(Boolean).slice(0, 2);
  const nexts = A.next.map(n => { const it = item("next", n.id); if (!it || it.neutral) return ""; return (it.free ? n.label : it.say || "").replace("{v}", n.label); }).filter(Boolean).slice(0, 2);
  // 2 番目以降に選んだ気持ち（ひとことに無いもの）は、行に余裕があるときだけ
  const f2 = A.feel.map(x => ({ ...item("feel", x.id), v: x.label })).find(x => x && x.id !== (f && f.id) && !x.neutral && !(x.key && new RegExp(x.key).test(t1raw)));

    model: res.model || "", prompt_version: res.prompt_version || "", elapsed_sec: Math.round((now() - t0) / 100) / 10, images_used: res.images_used || 0, result: res.ok ? res.result : null };

    S.aiCount = (S.aiCount || 0) + 1; S.aiOk = true; S.aiStale = false; S.aiError = "";
    S.aiText = res.result.rewrite; S.chosen = "AI"; if (S.edits) delete S.edits.AI;
    if (res.images_note) toast(res.images_note);
    save(); return "ok";
  }
  S.aiOk = false; S.aiError = res.message || "不明なエラー"; save();
  return res.code === "AUTH" ? "login" : "error";
}
async function attachSampleImages(refs) {
  await Promise.all(refs.map((r, i) => new Promise(res => {
    const p = SAMPLES[i]; if (!p || !p.img) return res();
    const img = new Image();
    img.onload = () => { try { r.image_data = drawToDataUrl(img, img.naturalWidth, img.naturalHeight, CONFIG.IMG_MAX_EDGE, CONFIG.IMG_QUALITY); } catch (e) {} res(); };
    img.onerror = () => res(); img.src = p.img;
  })));
}

/* =====================================================================
   記録（分析用。gas/DROP_COACH_LOG.gs v7 が列に展開する）
   - ノード：「層:タグ」（コンテンツ＝話題・どこが／人＝だれと・どこが／空間／感情＝気持ち／意向＝このあと）
   - ソフト分類：選んだ答えの重み（V の w × 選んだ順の重み）を足して合計 1 にしたもの
   - 気持ちの向き：選んだ気持ちの val を、選んだ順の重みで平均（-1〜1）
   - コーチ関与：ひとことのみ／選択あり／AI仕上げ（効果測定で分けて扱う）
===================================================================== */
const rankW = (kind, i) => { const a = ORDER_W[kind] || []; return a.length ? (a[i] ?? a[a.length - 1]) : .3; };
/** rank_w：選んだ順の重み（設定の値そのまま。例 1 / 0.75 / 0.5 / 0.25）・w：合計 1 にした重み */
function weighted(list, kind) {
  const ws = list.map((_, i) => rankW(kind, i)), sum = ws.reduce((a, b) => a + b, 0) || 1;
  return list.map((x, i) => ({ id: x.id, label: x.label, src: x.src || "", pre: !!x.pre, rank_w: r2(ws[i]), w: r2(ws[i] / sum),
    ...(kind === "feel" ? { val: (item("feel", x.id) || {}).val ?? null } : {}), ...(kind === "why" ? { layer: x.layer || "コンテンツ", kpi: x.w || W0() } : {}) }));
}
function softOf() {
  const A = S.ans, raw = { c1: 0, c2: 0, c3: 0, att: 0 };
  const add = (kind, id, k) => { const it = item(kind, id); if (!it || !it.w) return; Object.keys(it.w).forEach(d => { raw[d] += it.w[d] * k; }); };
  if (A.who) add("who", A.who.id, 1);
  A.why.forEach((x, i) => { const w = x.w || {}; Object.keys(raw).forEach(d => { raw[d] += (w[d] || 0) * rankW("why", i); }); });
  A.feel.forEach((x, i) => add("feel", x.id, rankW("feel", i)));
  A.next.forEach((x, i) => add("next", x.id, rankW("next", i)));
  A.find.forEach((x, i) => add("find", x.id, rankW("find", i)));
  A.face.forEach(x => add("face", x.id, 1));
  const tot = Object.values(raw).reduce((a, b) => a + b, 0), share = {};
  Object.keys(raw).forEach(k => { share[k] = tot ? r2(raw[k] / tot) : 0; raw[k] = r2(raw[k]); });
  return { share, raw, total: r2(tot) };
}
function valenceOf() {
  let s = 0, w = 0;
  S.ans.feel.forEach((x, i) => { const v = (item("feel", x.id) || {}).val; if (typeof v !== "number") return; const k = rankW("feel", i); s += v * k; w += k; });
  return w ? r2(s / w) : null;
}
function nodesOf() {
  const A = S.ans, n = [], subj = subjectOf();
  if (subj) n.push("コンテンツ:" + subj);
  if (A.who) n.push("人:" + (A.who.id === "other" ? "その他" : A.who.label));
  A.why.forEach(x => n.push((x.layer || "コンテンツ") + ":" + x.label));
  A.feel.forEach(x => n.push("感情:" + x.label));
  A.find.forEach(x => { if (x.id !== "none") n.push("発見:" + x.label); });
  A.face.forEach(x => { if (x.id !== "unknown") n.push("人:" + x.label); });
  A.next.forEach(x => n.push("意向:" + x.label));
  return uniq(n);
}
function coachLevel() {
  if (S.aiOk && S.chosen === "AI") return "AI仕上げ";
  return ["feel", "why", "who", "find", "face", "next"].some(id => S.done.includes(id) && !S.skipped.includes(id)) ? "選択あり" : "ひとことのみ";
}
/** 任意の問い：答えた（1 つ以上）／投稿文へ（任意の最初で終えた）／空（最低限の前に終わった） */
function optState() {
  if (!S.optIntro) return "";
  return OPT_STEPS.some(id => S.done.includes(id) && !S.skipped.includes(id)) ? "答えた" : "投稿文へ";
}
function buildRecord(end) {
  const A = S.ans, soft = softOf(), stepSec = {};
  Object.keys(S.times).forEach(k => { const t = S.times[k]; if (t.answered && t.shown) stepSec[k] = r2((t.answered - t.shown) / 1000); });
  const lastAsked = S.asked.filter(id => id !== "login").slice(-1)[0] || "";
  const h = S.hint || {};
  return {
    schema: "drop_chat_v3", app_version: APP_VERSION, session_id: S.sid, end,
    started_at: S.started, ended_at: new Date().toISOString(), duration_sec: r2((now() - S.t0) / 1000),
    answered: answeredCount(),
    last_step: S.phase === "compose" ? (S.early ? "途中で投稿文へ（" + stepName(lastAsked) + "）" : "最後まで") : stepName(lastAsked),
    early: S.early, has_photo: hasPhoto(),
    text1: A.text1,
    detected: { ...S.det, feel_labels: S.det.feels.map(id => (item("feel", id) || {}).label || id), who_label: S.det.who ? item("who", S.det.who).label : "" },
    subject: subjectOf(),
    answers: {
      who: A.who ? { id: A.who.id, label: A.who.label, detail: A.who.detail || "", pre: !!A.who.pre } : { id: "", label: "", detail: "" },
      why: weighted(A.why, "why"), feel: weighted(A.feel, "feel"), next: weighted(A.next, "next"), find: weighted(A.find, "find"),
      face: A.face.length ? { id: A.face[0].id, label: A.face[0].label, src: A.face[0].src || "" } : { id: "", label: "" },
      profile: A.profile || LS.get(CONFIG.KEYS.PROFILE, null) || { id: "", label: "" },
      score: A.score
    },
    valence: valenceOf(),
    skipped: S.skipped.slice(),
    hashtags: S.phase === "compose" ? activeTags() : [],
    nodes: nodesOf(), soft: soft.share, soft_raw: soft.raw, soft_total: soft.total,
    texts: { composed: S.composed, ai: S.aiText, ai_prev: S.aiPrev || [], ai_count: S.aiCount || 0, final: S.phase === "compose" ? finalText() : "", chosen: S.chosen, edited: isEdited() },
    coach_level: coachLevel(),
    ai: S.ai ? { status: S.ai.status, message: S.ai.message, cached: S.ai.cached, model: S.ai.model, prompt_version: S.ai.prompt_version, elapsed_sec: S.ai.elapsed_sec, result: S.ai.result } : { status: "" },
    hint: { status: h.status || "", elapsed_sec: h.elapsed_sec, cached: !!h.cached, subject: h.subject || "", why_options: h.why_options || [] },
    example_views: S.exViews || [], preview_opens: S.previewOpens || 0,
    why_for: S.whyFor || "", settings_version: SETTINGS_VER,
    extra: optState(), chat_rating: S.rating || null, chat_comment: S.ratingComment || "", post_no: S.postNo || (postStats().n + (S.copied ? 0 : 1)),
    order: S.order, step_sec: stepSec, big_text: document.documentElement.classList.contains("big")
  };
}
async function sendLog(end) {
  if (!S) return;
  const rec = buildRecord(end);
  if (STAFF) pushHistory(rec);
  if (!logOn()) return;
  const key = end + "|" + rec.texts.final + "|" + (rec.chat_rating || "") + "|" + rec.chat_comment;
  if (S.loggedKey === key) return;
  let tok = getToken(CONFIG.KEYS.LOG_TOKEN);
  if (!tok && await autoLogin()) tok = getToken(CONFIG.KEYS.LOG_TOKEN);
  if (!tok) return;
  let r = await post({ action: "log", token: tok, session: rec }, CONFIG.LOG_URL);
  if (!r.ok && r.code === "AUTH") { LS.del(CONFIG.KEYS.LOG_TOKEN); if (await autoLogin()) r = await post({ action: "log", token: getToken(CONFIG.KEYS.LOG_TOKEN), session: rec }, CONFIG.LOG_URL); }
  if (r.ok) { S.logged = true; S.loggedKey = key; save(); } else console.warn("記録できませんでした", r);
  renderStaff();
}
/* 画面を閉じたとき：答えが 1 つ以上あって未記録なら「途中離脱」として送る */
window.addEventListener("pagehide", () => {
  if (!S || S.logged || S.abandonSent || !S.ans.text1 || !logOn()) return;
  const tok = getToken(CONFIG.KEYS.LOG_TOKEN); if (!tok) return;
  try {
    const body = JSON.stringify({ action: "log", token: tok, session: buildRecord("abandon") });
    if (navigator.sendBeacon(CONFIG.LOG_URL, new Blob([body], { type: "text/plain;charset=utf-8" }))) { S.abandonSent = true; save(); }
  } catch (e) {}
});

/* ---------- スタッフ用（?staff=1） ---------- */
function pushHistory(rec) {
  const h = LS.get(CONFIG.KEYS.HISTORY, []), i = h.findIndex(x => x.session_id === rec.session_id);
  if (i >= 0) h[i] = rec; else h.push(rec);
  LS.set(CONFIG.KEYS.HISTORY, h.slice(-300));
}
function renderStaff() {
  const box = $("after");
  if (!STAFF || !S || S.phase !== "compose") { box.innerHTML = ""; return; }
  const rec = buildRecord("preview"), s = rec.soft, n = LS.get(CONFIG.KEYS.HISTORY, []).length;
  box.innerHTML = `<div class="card staff">
    <div class="card-hd"><b>分析用の記録（スタッフ用）</b></div>
    <table>
      <tr><td>関与・時間</td><td>${esc(rec.coach_level)}・${rec.answered}問・${Math.round(rec.duration_sec)}秒</td></tr>
      <tr><td>読み取り</td><td>${esc(JSON.stringify(rec.detected))}</td></tr>
      <tr><td>ノード</td><td>${esc(rec.nodes.join("｜") || "−")}</td></tr>
      <tr><td>気持ちの向き</td><td>${rec.valence ?? "−"}</td></tr>
      <tr><td>ソフト分類</td><td><div class="bars">${Object.keys(SOFT_LABEL).map(k => `<span>${SOFT_LABEL[k]}</span><s><u style="width:${Math.round(s[k] * 100)}%"></u></s><span>${s[k].toFixed(2)}</span>`).join("")}</div></td></tr>
      ${rec.ai.status === "OK" && rec.ai.result ? `<tr><td>AI 読み取り</td><td>${esc((rec.ai.result.category || {}).label || "")}／${esc(ACT_LABEL[rec.ai.result.act] || "")}／${esc((rec.ai.result.content || []).join("・"))}／向き ${rec.ai.result.sentiment}</td></tr>` : ""}
      <tr><td>ヒント</td><td>${esc(rec.hint.status)} ${rec.hint.elapsed_sec ?? ""}秒 ${esc(rec.hint.subject)} ${esc((rec.hint.why_options || []).join("・"))}</td></tr>
    </table>
    <details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer">記録 JSON</summary><pre>${esc(JSON.stringify(rec, null, 1))}</pre></details>
    <div class="row"><button type="button" class="btn sm ghost" id="sJson">JSON をコピー</button><button type="button" class="btn sm ghost" id="sCsv">この端末の記録を CSV で保存（${n}件）</button></div>
  </div>`;
  $("sJson").addEventListener("click", async () => { try { await navigator.clipboard.writeText(JSON.stringify(rec)); toast("コピーしました"); } catch (e) { toast("コピーできませんでした"); } });
  $("sCsv").addEventListener("click", downloadCsv);
}
function downloadCsv() {
  const h = LS.get(CONFIG.KEYS.HISTORY, []);
  if (!h.length) { toast("まだ記録がありません"); return; }
  const L = a => (a || []).map(x => x.label).join("、");
  const cols = [["セッションID", r => r.session_id], ["開始", r => r.started_at], ["終了", r => r.end], ["所要秒", r => r.duration_sec], ["回答数", r => r.answered],
    ["写真", r => (r.has_photo ? "あり" : "なし")], ["最初のひとこと", r => r.text1], ["話題", r => r.subject], ["だれと", r => r.answers.who.label], ["どんな人", r => r.answers.who.detail],
    ["どこが", r => L(r.answers.why)], ["気持ち", r => L(r.answers.feel)], ["気持ちの向き", r => r.valence ?? ""], ["このあと", r => L(r.answers.next)],
    ["属性", r => (r.answers.profile || {}).label || ""], ["ノード", r => r.nodes.join("｜")], ["ソフト①", r => r.soft.c1], ["ソフト②", r => r.soft.c2], ["ソフト③", r => r.soft.c3], ["ソフト愛着", r => r.soft.att],
    ["最終文面", r => r.texts.final], ["採用", r => r.texts.chosen], ["手で編集", r => (r.texts.edited ? "あり" : "なし")], ["コーチ関与", r => r.coach_level]];
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = "﻿" + [cols.map(c => c[0]).join(","), ...h.map(r => cols.map(c => cell(c[1](r))).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `drop_chat_v3_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- メニュー ---------- */
async function loadSamples() {
  for (const s of CONFIG.DATA_SOURCES) {
    try { const r = await fetch(s, { cache: "no-cache" }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); } catch (e) { /* 次へ */ }
  }
  try { return JSON.parse($("sampleFallback").textContent); } catch (e) { return { records: [] }; }
}
const hasTokensAny = () => !!(LS.get(CONFIG.KEYS.TOKEN, null) || LS.get(CONFIG.KEYS.LOG_TOKEN, null));
function syncMenu() { $("mLogout").hidden = !(getCreds() || hasTokensAny()); $("mBig").textContent = document.documentElement.classList.contains("big") ? "文字を標準にもどす" : "文字を大きく"; }
$("menuBtn").addEventListener("click", () => { const m = $("menu"); m.hidden = !m.hidden; $("menuBtn").setAttribute("aria-expanded", String(!m.hidden)); syncMenu(); });
const closeMenu = () => { $("menu").hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); };
document.addEventListener("click", e => { if (!$("menu").hidden && !e.target.closest("#menu") && !e.target.closest("#menuBtn")) closeMenu(); });
$("mBig").addEventListener("click", () => { const b = !document.documentElement.classList.contains("big"); document.documentElement.classList.toggle("big", b); LS.set(CONFIG.KEYS.BIG, b); syncMenu(); syncDockH(); });
$("mExamples").addEventListener("click", () => { closeMenu(); openExamples(); });
$("mAbout").addEventListener("click", () => {
  closeMenu();
  openSheet("このチャットについて", `
    <p>DROP に投稿する文を、いくつかの問いに答えながら一緒につくるチャットです。問いはとばせますし、いつでも「ここまでで投稿文をつくる」で終われます。</p>
    <p><b>AI について：</b>写真とあなたの答えをもとに、AI が文を読みやすく整えます。あなたが書いていない出来事や気持ちは足さないようにしています。最後に「AI が整えた文」と「自分の言葉の文」から選べます。</p>
    <p><b>答えの使い道：</b>答えと投稿文は、CULTURE SNACK の効果を確かめる分析にだけ使います。投稿文は、あなたがコピーして DROP に投稿するまで公開されません。名前は分析画面にだけ表示されます。</p>
    <div class="row"><button type="button" class="btn full" id="shBack">もどる</button></div>`);
  $("shBack").addEventListener("click", closeModal);
});
$("mRestart").addEventListener("click", () => { closeMenu(); restart(); });
$("mProfile").addEventListener("click", () => {
  closeMenu(); LS.del(CONFIG.KEYS.PROFILE); toast("次の投稿のさいごに、もう一度聞きます");
  if (S && S.phase === "ask") { S.done = S.done.filter(x => x !== "profile"); renderProgress(); }
});
$("mLogout").addEventListener("click", () => { closeMenu(); [CONFIG.KEYS.TOKEN, CONFIG.KEYS.LOG_TOKEN, CONFIG.KEYS.PW].forEach(k => LS.del(k)); syncMenu(); toast("ログアウトしました（保存したパスワードも削除しました）"); });
async function restart() {
  if (S && !S.logged && S.ans.text1 && S.phase === "compose") sendLog("reset");
  closeModal(); start();
}

/* ---------- 設定（選択肢と重み）を記録用 GAS から読む ---------- */
const SET = { pending: null, next: null };
const optionStepsStarted = () => !!S && ["feel", "why", "who", "next"].some(id => S.asked.includes(id));
function loadSettings() {
  const cached = LS.get(CONFIG.KEYS.SETTINGS, null);
  if (cached && cached.settings) applySettings(cached.settings, cached.version);
  if (!logOn()) return;
  SET.pending = post({ action: "settings" }, CONFIG.LOG_URL, CONFIG.SETTINGS_TIMEOUT_MS).then(r => {
    SET.pending = null;
    if (!r || !r.ok) return;   // 古い GAS（設定に未対応）・通信エラー → いまの設定のまま
    const ver = r.settings ? String(r.version || "") : "初期値";
    if (r.settings) LS.set(CONFIG.KEYS.SETTINGS, { settings: r.settings, version: ver }); else LS.del(CONFIG.KEYS.SETTINGS);
    if (ver === SETTINGS_VER) return;
    if (optionStepsStarted()) SET.next = { settings: r.settings, version: ver };   // 答えている途中は変えず、次のチャットから
    else applySettings(r.settings || DEFAULT_SETTINGS, ver);
  });
}

/* ---------- 起動 ---------- */
function warmLogin() { if (anyGas() && getCreds() && !hasTokens()) autoLogin().catch(() => {}); }
async function start() {
  RT.gen++; RT.typing = false; RT.typingText = "";
  SS.del(CONFIG.KEYS.PHOTO); PHOTO = { img: "", imgAi: "", w: 0, h: 0 };
  if (SET.next) { applySettings(SET.next.settings || DEFAULT_SETTINGS, SET.next.version); SET.next = null; }
  S = newSession(); RT.rendered = 0; RT.busy = true; RT.aiWait = false; RT.loginFor = null;
  save(); renderMsgs(); renderStaff(); lockDock(); warmLogin();
  const g = RT.gen;
  const ps = postStats();
  const hello = ps.n > 0 ? [`おかえりなさい！ ${ps.n + 1}本目をつくりましょう`, { sub: "写真とひとことのあと、タップで3つ答えるだけです" }]
    : ["こんにちは！ DROP の投稿文を、チャットで一緒につくります", { sub: "写真とひとことのあと、タップで3つ答えるだけ。あとは任意です" }];
  if (!await bot(hello[0], hello[1])) return;
  await advance(null, g);
}
function restore() {
  const s = LS.get(CONFIG.KEYS.SESSION, null);
  if (!s || s.v !== 32 || !s.sid || now() - (s.t0 || 0) > CONFIG.RESUME_HOURS * 3600e3 || s.copied) return false;
  S = s; S.msgs = (S.msgs || []).filter(m => m && m.who);
  const p = SS.get(CONFIG.KEYS.PHOTO, null);
  if (p && p.sid === S.sid && /^data:image\/jpeg;base64,/.test(p.img || "")) PHOTO = p;
  RT.rendered = S.msgs.length; renderMsgs(); renderStaff(); warmLogin();
  if (S.hint && S.hint.status === "待ち") { S.hint = null; if (S.ans.text1 && S.phase === "ask") fireHint(); }
  if (S.phase === "compose") {
    if (!S.msgs.some(m => m.card === "compose")) { lockDock(); finishCompose(false); return true; }
    renderComposeDock(); return true;
  }
  const st = stepOf(S.cur);
  if (!st || !applicable(st)) { lockDock(); advance(S.cur ? S.cur : null); return true; }
  if (st.opts) prepareOrder(st);
  setSelFromAns(st);
  RT.busy = false; renderDock();
  return true;
}
(async () => {
  $("staffFlag").hidden = !STAFF;
  if (LS.get(CONFIG.KEYS.BIG, false)) document.documentElement.classList.add("big");
  syncMenu();
  loadSettings();
  const json = await loadSamples();
  SAMPLES = (Array.isArray(json) ? json : (json.records || [])).map(r => ({
    id: r.artwork_id, n: r.account_name || "", s: String(r.sentence || "").trim(), img: r.image_file_path || r.image_file_path_thumbnail || ""
  })).filter(p => p.s);
  if (!restore()) start();
})();
