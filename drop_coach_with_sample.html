<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>DROP. Coach — 投稿づくりチャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f5f9; --bg-b:#ecebf1; --card:#fff;
    --stroke:#d6d2df; --stroke-soft:#ebe9f0;
    --text:#1d1b22; --muted:#55525e; --dim:#8a8794;
    --rich:#7a58b0; --rich-2:#a98cd0; --rich-soft:#efe9f7; --rich-ink:#553a85;
    --ok:#2f6b4a; --ok-soft:#e7f4ec; --warn:#8a5f00; --err:#b3372a;
    --font:"Inter","Noto Sans JP",system-ui,-apple-system,sans-serif;
    --dockH:160px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:var(--font)}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  svg{flex:none}
  /* 文字を大きく（メニュー） */
  html.big .chat, html.big .dock-scroll, html.big .dock-act, html.big .sheet, html.big .pv-in{zoom:1.15}

  /* ---------- 上部 ---------- */
  .top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--stroke-soft)}
  .appbar-in{max-width:640px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:14px}
  .brand{font-weight:900;font-size:18px;letter-spacing:-.4px;line-height:1;white-space:nowrap}
  .brand i{font-style:normal;color:var(--rich)}
  .brand small{display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--dim);margin-top:4px}
  .prog{flex:1;height:6px;background:var(--bg-b);border-radius:3px;overflow:hidden}
  .prog span{display:block;height:100%;width:0;background:var(--rich);border-radius:3px;transition:width .35s ease}
  .icon-btn{width:42px;height:42px;border:1px solid var(--stroke);background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .icon-btn svg{width:20px;height:20px}
  .menu{max-width:640px;margin:0 auto;padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .menu button{border:1px solid var(--stroke);background:#fff;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--muted)}
  .staff-flag{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--warn);padding:3px 7px;border-radius:4px}
  /* 投稿イメージのバー */
  .pv{display:block;width:100%;border:none;border-top:1px solid var(--stroke-soft);background:var(--rich-soft);padding:0;text-align:left}
  .pv-in{max-width:640px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
  .pv-k{font-size:12px;font-weight:800;color:var(--rich-ink);white-space:nowrap}
  .pv-t{flex:1;min-width:0;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-dots{display:flex;gap:4px}
  .pv-dots i{width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--rich-2)}
  .pv-dots i.on{background:var(--rich);border-color:var(--rich)}
  .pv-open{font-size:12.5px;font-weight:800;color:var(--rich-ink);white-space:nowrap}

  /* ---------- チャット ---------- */
  .chat{max-width:640px;margin:0 auto;padding:14px 14px calc(var(--dockH) + 16px)}
  .msg{display:flex;gap:8px;margin:12px 0;align-items:flex-start}
  .msg.me{justify-content:flex-end}
  .msg.new{animation:pop .28s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--text);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .avatar i{font-style:normal;color:var(--rich-2)}
  .avatar.ai{background:var(--rich)}
  .bubble{max-width:84%;padding:11px 15px;font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;border-radius:4px 18px 18px 18px;background:#fff;border:1px solid var(--stroke-soft)}
  .msg.me .bubble{background:var(--rich);border-color:var(--rich);color:#fff;border-radius:18px 4px 18px 18px}
  .msg.me .bubble.muted{background:var(--bg-b);border-color:var(--bg-b);color:var(--muted);font-size:14.5px}
  .msg.me .bubble.photo{padding:0;overflow:hidden;max-width:62%;background:var(--bg-b);border-color:var(--stroke-soft)}
  .msg.me .bubble.photo img{display:block;width:100%;max-height:340px;object-fit:cover}
  .msg.me .bubble.photo .nophoto{display:block;padding:16px 18px;color:var(--muted);font-size:14px}
  .bubble .sub{display:block;margin-top:6px;font-size:13.5px;color:var(--muted);white-space:normal;line-height:1.55}
  .typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px}
  .typing .bubble i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.1s infinite}
  .typing .bubble i:nth-child(2){animation-delay:.15s}.typing .bubble i:nth-child(3){animation-delay:.3s}
  .typing .bubble em{font-style:normal;font-size:13.5px;color:var(--muted);margin-left:8px}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* ---------- 投稿文カード ---------- */
  .card{background:#fff;border:2px solid var(--rich);border-radius:18px;padding:14px;width:100%;max-width:86%}
  .card-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .card-hd b{font-size:14px;color:var(--rich-ink)}
  .card-photo{display:block;width:44px;height:44px;object-fit:cover;border-radius:8px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-b);border-radius:12px;padding:3px;margin-bottom:10px}
  .seg button{border:none;background:none;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:800;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--rich-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .card textarea{display:block;width:100%;border:1.5px dashed var(--stroke);border-radius:12px;resize:none;font-size:17px;line-height:1.75;min-height:140px;outline:none;padding:8px 10px;color:var(--text);background:#fff}
  .card textarea:focus{border-color:var(--rich);border-style:solid}
  .card-foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .card-foot .cnt{font-size:13px;color:var(--dim)}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;margin-left:auto}
  .switch input{width:20px;height:20px;accent-color:var(--rich)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{border:1.5px solid var(--rich-2);background:var(--rich-soft);color:var(--rich-ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
  .tag.off{background:#fff;border-color:var(--stroke);color:var(--dim);text-decoration:line-through}
  .note{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:8px}
  .note.warn{color:var(--warn)}
  .card.staff{border-color:var(--warn);border-style:dashed;max-width:100%}
  .card.staff b{color:var(--warn)}
  .card.staff table{width:100%;border-collapse:collapse;font-size:13px}
  .card.staff td{border-top:1px solid var(--stroke-soft);padding:5px 4px;vertical-align:top}
  .card.staff td:first-child{color:var(--dim);white-space:nowrap;width:1%}
  .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px}
  .bars s{display:block;height:8px;background:var(--bg-b);border-radius:4px;overflow:hidden;text-decoration:none}
  .bars s u{display:block;height:100%;background:var(--rich)}
  .card.staff pre{max-height:240px;overflow:auto;background:var(--bg);padding:8px;font-size:11px;border-radius:8px;white-space:pre-wrap;word-break:break-all}

  /* ---------- 回答エリア ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--stroke-soft);box-shadow:0 -10px 30px -22px rgba(60,40,100,.45)}
  .dock-in{max-width:640px;margin:0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px)}
  .dock-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 1px}
  .dock-act{flex:none;padding-top:10px}
  .dock-act .row{margin-top:0}
  body.editing .dock{display:none}
  .dock-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 6px;font-size:13.5px;color:var(--dim);font-weight:700;flex-wrap:wrap}
  .dock-top .lnk{color:var(--rich-ink);padding:6px 0;min-height:36px;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{min-height:46px;padding:8px 15px;border:1.5px solid var(--stroke);border-radius:999px;background:#fff;font-size:16px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--rich-soft);border-color:var(--rich);color:var(--rich-ink)}
  .chip .ord{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--rich);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
  .chip .ck{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--rich);color:#fff;font-size:12px;align-items:center;justify-content:center}
  .chip.sub{color:var(--muted);border-style:dashed}
  .chip.ai{border-style:dashed;border-color:var(--rich-2)}
  .chip.ai small{font-size:11px;font-weight:800;color:var(--rich);background:var(--rich-soft);border-radius:4px;padding:1px 5px}
  .chip.ai.on small{background:#fff}
  .chip.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .row.center{justify-content:center}
  .btn{min-height:50px;padding:0 20px;border:none;border-radius:999px;background:var(--rich);color:#fff;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn svg{width:19px;height:19px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:#fff;color:var(--rich-ink);border:1.5px solid var(--rich-2)}
  .btn.plain{background:var(--bg-b);color:var(--muted)}
  .btn.sm{min-height:42px;padding:0 16px;font-size:14.5px}
  .btn.wide{flex:1}
  .btn.full{width:100%}
  .lnk{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px 6px;min-height:40px}
  .inrow{display:flex;gap:8px;align-items:flex-end}
  .input{flex:1;min-height:50px;max-height:150px;border:1.5px solid var(--stroke);border-radius:25px;padding:12px 17px;font-size:17px;line-height:1.45;outline:none;resize:none;background:#fff;color:var(--text);width:100%}
  .input:focus{border-color:var(--rich)}
  .input.sm{min-height:46px;font-size:16px}
  .send{width:50px;height:50px;border-radius:50%;border:none;background:var(--rich);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .send:disabled{opacity:.35}
  .send svg{width:22px;height:22px}
  .lab{font-size:13.5px;font-weight:700;color:var(--muted);margin:12px 0 6px}
  .cnt-sm{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .scale button{height:50px;border-radius:12px;border:1.5px solid var(--stroke);background:#fff;font-weight:800;font-size:16px;color:var(--text);padding:0}
  .scale button:active,.scale button.on{background:var(--rich);border-color:var(--rich);color:#fff}
  .scale-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:5px;padding:0 2px}
  .login{display:grid;gap:8px}
  .login .input{border-radius:14px}
  .err{font-size:14px;color:var(--err);min-height:1em}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;font-size:15px;color:var(--muted);min-height:50px}
  .spin{width:20px;height:20px;border:2.5px solid var(--rich-soft);border-top-color:var(--rich);border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .hint{font-size:13px;color:var(--dim);margin-top:6px}

  /* ---------- トースト・シート ---------- */
  .toast{position:fixed;left:50%;top:86px;transform:translateX(-50%) translateY(-10px);background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,30,.55);display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sheet-hd b{font-size:18px}
  .sheet-hd .icon-btn{margin-left:auto}
  .sheet p{margin:0 0 12px;font-size:15px;color:var(--muted);line-height:1.7}
  .draft{border:2px solid var(--rich-2);background:var(--rich-soft);border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.8;white-space:pre-wrap;color:var(--text)}
  .mat{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .mat span{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;border-radius:999px;padding:6px 12px;border:1.5px solid var(--stroke);color:var(--dim);background:#fff}
  .mat span.on{border-color:var(--rich);color:var(--rich-ink);background:var(--rich-soft)}
  .mat span i{font-style:normal}
  .sec-h{font-size:14px;font-weight:800;color:var(--rich-ink);margin:16px 0 8px}
  .ex{display:flex;gap:12px;border:1px solid var(--stroke-soft);border-radius:14px;padding:10px;background:#fff;margin-top:8px}
  .ex img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg-b)}
  .ex p{margin:0;font-size:15px;line-height:1.65;white-space:pre-wrap;color:var(--text)}
  @media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:20px;max-height:86vh} }
  /* 小さい画面（iPhone SE など）：問いが隠れないように、上部を詰めて回答エリアを少し低く */
  @media (max-height:640px){ .brand small{display:none} .appbar-in{padding:8px 14px} .pv-in{padding:6px 14px} .dock-in{max-height:calc(100vh - 280px);max-height:calc(100dvh - 280px)} }
</style>
</head>
<body>
<header class="top">
  <div class="appbar-in">
    <div class="brand">DROP<i>.</i> Coach<small>投稿づくりチャット</small></div>
    <div class="prog" aria-hidden="true"><span id="progBar"></span></div>
    <span class="staff-flag" id="staffFlag" hidden>STAFF</span>
    <button type="button" class="icon-btn" id="menuBtn" aria-label="メニュー" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <nav class="menu" id="menu" hidden>
    <button type="button" id="mBig">文字を大きく</button>
    <button type="button" id="mExamples">ほかの人の例</button>
    <button type="button" id="mAbout">このチャットについて</button>
    <button type="button" id="mRestart">最初からやり直す</button>
    <button type="button" id="mProfile">「あなたについて」を答え直す</button>
    <button type="button" id="mLogout" hidden>ログアウト</button>
  </nav>
  <button type="button" class="pv" id="pvBar" hidden aria-label="いまの投稿イメージを見る">
    <span class="pv-in"><span class="pv-k">あなたの投稿</span><span class="pv-t" id="pvText"></span><span class="pv-dots" id="pvDots"></span><span class="pv-open">見る</span></span>
  </button>
</header>

<main class="chat" id="chat" aria-live="polite">
  <div id="msgs"></div>
  <div id="after"></div>
</main>

<footer class="dock" id="dock"><div class="dock-in" id="dockIn"></div></footer>
<input type="file" id="file" accept="image/*" hidden />
<div class="toast" id="toast" role="status"></div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet-hd"><b id="modalTitle"></b><button type="button" class="icon-btn" id="modalX" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

/* =====================================================================
   ひとことの読み取り（画面内の簡易な辞書。外れても選び直せる）
   - 気持ち：V.feel の key に当たる言葉 → 気持ちの問いで先に選んでおく
   - だれと：V.who の key に当たる言葉 → だれとの問いで先に選んでおく
   - 話題：最初の気持ちの言葉より前（例「コーヒーおいしかった」→「コーヒー」）。問いの言い方に使う。AI のヒントが届けばそちらを優先
===================================================================== */
function detect(text) {
  const t = String(text || "");
  const feels = [], pos = [];
  V.feel.forEach(f => { if (!f.key) return; const m = t.match(new RegExp(f.key)); if (m) { feels.push(f.id); pos.push(m.index); } });
  const w = V.who.find(x => x.key && new RegExp(x.key).test(t));
  const next = /たい|また来|来年|次は|やってみ|行こう|しよう/.test(t);
  let subject = "";
  if (pos.length && Math.min(...pos) > 0) {
    subject = t.slice(0, Math.min(...pos)).replace(/^(この|その|あの|写真の|今日の)/, "");
    for (let k = 0; k < 3; k++) subject = subject.replace(/[\s、。,.!！?？〜~…]+$/, "").replace(/(が|は|も|を|の|って|で|に|と)$/, "");
    if (subject.length > 12 || /[たてだる]$/.test(subject)) subject = "";
  }
  return { feels, who: w ? w.id : "", next, subject };
}
const subjectOf = () => (S.hint && S.hint.subject) || S.det.subject || "";

/* =====================================================================
   問い
===================================================================== */
const whoItem = () => (S.ans.who ? item("who", S.ans.who.id) : null);
const hasPhoto = () => S.done.includes("photo") && !S.skipped.includes("photo");
function firstFeel() {   // いちばん大事な気持ち（選んだもの → ひとことから読み取ったもの）
  const f = S.ans.feel.find(x => { const it = item("feel", x.id); return it && !it.neutral; });
  if (f) return { ...item("feel", f.id), v: f.label };
  const d = S.det.feels.map(id => item("feel", id)).find(it => it && !it.neutral);
  return d ? { ...d, v: d.label } : null;
}
function preNote(kind) {
  if (kind === "who" && S.det.who && S.ans.who == null) return `ひとことから「${item("who", S.det.who).label}」を選んでおきました。違っていたら変えてください`;
  if (kind === "feel" && S.det.feels.length) return `ひとことから「${S.det.feels.map(id => item("feel", id).label).join("・")}」を選んでおきました。ほかにもあれば足してください`;
  return "";
}
const STEPS = [
  { id: "login", kind: "login", count: false,
    when: () => CONFIG.LOGIN_AT_START && anyGas() && !S.noLogin && !getCreds() && !hasTokens(),
    q: () => "はじめに、名前（ニックネームでOK）と、運営からお知らせしたパスワードを入れてください。この端末では1回だけです",
    sub: () => "答えは、イベントの効果を確かめる分析にだけ使います。投稿文は、あなたがコピーしてDROPに投稿するまで公開されません" },
  { id: "photo", kind: "photo", count: false, q: () => "投稿する写真を1枚えらんでください（写真なしでも大丈夫です）" },
  { id: "text1", kind: "text", required: true, max: CONFIG.MAX_TEXT1, multiline: true,
    q: () => hasPhoto() ? "この写真のこと、ひとことどうぞ。思ったままで大丈夫です" : "今日のこと、ひとことどうぞ。思ったままで大丈夫です",
    sub: () => "これが投稿文のもとになります。キーボードのマイクで話して入力もできます",
    ph: () => hasPhoto() ? "例：コーヒーおいしかった" : "例：豆本かわいい！" },
  { id: "who", kind: "who", opts: "who", q: () => "そのとき、だれと一緒でしたか？", sub: () => preNote("who") },
  { id: "why", kind: "multi", opts: "why", max: 3, freePh: "ほかにあれば、ひとことで",
    q: () => { const s = subjectOf(), f = firstFeel(); return (s ? `${s}の、` : "") + (f && f.q ? f.q : "どこがよかったですか？"); },
    sub: () => (S.hint && (S.hint.why_options || []).length ? (hasPhoto() ? "写真から見つけた候補もあります。" : "AI の案もあります。") : "") + "いくつでも選べます" },
  { id: "feel", kind: "multi", opts: "feel", max: 4, freePh: "ほかの言葉で",

    sub: () => preNote("feel") },
  { id: "score", kind: "scale", count: false, when: () => CONFIG.ASK_SCORE,
    q: () => (subjectOf() ? `「${subjectOf()}」の体験そのものは` : "今日のその体験そのものは") + "、10点満点で何点ですか？",
    sub: () => "※このチャットの点数ではありません" },
  { id: "next", kind: "multi", opts: "next", max: 2, freePh: "ほかにあれば（例：友だちを誘う）",
    q: () => "このあと、どうしたいですか？（2つまで）" },
  { id: "profile", kind: "single", opts: "profile", count: false,

    q: () => "さいごに、あなたについて教えてください（この端末では1回だけ聞きます）" }
];
const STEP_LABEL = { login: "ログイン", photo: "写真", text1: "ひとこと", who: "だれと", why: "どこが", feel: "気持ち", score: "点数", next: "このあと", profile: "あなたについて" };
const stepName = id => STEP_LABEL[id] || id || "";
const stepOf = id => STEPS.find(s => s.id === id);
const applicable = st => !st.when || st.when();
function nextStepAfter(id) {
  const i = id ? STEPS.findIndex(s => s.id === id) : -1;
  for (let k = i + 1; k < STEPS.length; k++) { const st = STEPS[k]; if (!S.done.includes(st.id) && applicable(st)) return st; }
  return null;
}
function remainingSteps() { return STEPS.filter(st => !S.done.includes(st.id) && !["login", "photo"].includes(st.id) && applicable(st)); }
function answeredCount() { return S.done.filter(id => { const st = stepOf(id); return st && st.count !== false && !S.skipped.includes(id); }).length; }

/* ---------- 表示 ---------- */
function renderMsgs() {

}

function scrollEnd() { requestAnimationFrame(() => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" })); }
function renderProgress() {
  const done = S.done.filter(id => !["login"].includes(id)).length;

function bot(text, extra = {}) {
  const g = RT.gen;

    RT.typing = true; renderMsgs();
    setTimeout(() => {
      if (g !== RT.gen) return res(false);
      RT.typing = false; S.msgs.push({ who: "bot", text, ...extra }); renderMsgs(); save(); res(true);
    }, CONFIG.BOT_DELAY);
  });
}
function me(text, extra = {}) { S.msgs.push({ who: "me", text, ...extra }); renderMsgs(); save(); }
let toastTimer = null;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200); }

function lockDock() { RT.busy = true; dock(`<div class="wait"><span class="spin"></span></div>`); }

/* =====================================================================
   チャットの進行
===================================================================== */
async function ask(st) {
  const g = RT.gen;
  S.cur = st.id; S.phase = "ask";
  if (!S.asked.includes(st.id)) S.asked.push(st.id);
  S.times[st.id] = { shown: now() };
  if (st.opts) prepareOrder(st);
  setSelFromAns(st);
  const sub = st.sub ? st.sub() : "";
  await bot(st.q(), sub ? { sub } : {});
  if (g !== RT.gen) return;
  RT.busy = false; renderDock(); save();
}
async function advance(fromId, g = RT.gen) {
  if (g !== RT.gen) return;
  const n = nextStepAfter(fromId);
  if (n) await ask(n); else await toCompose(false);
}
function markDone(st) { if (!S.done.includes(st.id)) S.done.push(st.id); const t = S.times[st.id]; if (t) t.answered = now(); }
async function answered(st, display, extra) {
  markDone(st); S.skipped = S.skipped.filter(x => x !== st.id);
  if (display != null) me(display, extra);
  lockDock(); await advance(st.id);
}
async function skipStep(st) {
  if (RT.busy) return;
  if (st.id === "profile") LS.set(CONFIG.KEYS.PROFILE, { id: "none", label: "答えない" });
  if (!S.skipped.includes(st.id)) S.skipped.push(st.id);
  markDone(st); me("とばす", { muted: true }); lockDock(); await advance(st.id);
}
async function exitEarly() {
  if (RT.busy) return;
  S.early = true; me("ここまでで投稿文をつくる", { muted: true }); lockDock(); await toCompose(true);
}
function prepareOrder(st) {
  if (S.order[st.id]) return;
  const list = V[st.opts].filter(x => !x.hidden);
  const body = list.filter(x => !x.fixed), tail = list.filter(x => x.fixed);
  S.order[st.id] = (CONFIG.SHUFFLE ? shuffle(body) : body).concat(tail).map(x => x.id);
}
function optionsOf(st) {
  const base = (S.order[st.id] || V[st.opts].map(x => x.id)).map(id => item(st.opts, id)).filter(x => x && !x.hidden);
  if (st.id === "why" && S.hint && (S.hint.why_options || []).length) {
    return S.hint.why_options.map(l => ({ id: "ai:" + l, label: l, ai: true })).concat(base);
  }
  return base;
}
/** 選択の初期値：答えたことがあればそれ。初めての問いは、ひとことから読み取ったものを先に選んでおく */
function setSelFromAns(st) {
  RT.freeText[st.id] = "";
  if (st.kind === "who") {
    RT.who = S.ans.who ? { ...S.ans.who } : (S.det.who ? { id: S.det.who, label: item("who", S.det.who).label, detail: "", pre: true } : null);
    return;
  }
  if (st.kind !== "multi") { RT.sel = []; return; }
  const a = S.ans[st.id] || [];
  if (a.length) {
    RT.sel = a.filter(x => x.id !== "other").map(x => ({ ...x }));
    const f = a.find(x => x.id === "other"); RT.freeText[st.id] = f ? f.label : "";
  } else if (st.id === "feel" && S.det.feels.length) {
    RT.sel = S.det.feels.map(id => ({ id, label: item("feel", id).label, pre: true }));
  } else RT.sel = [];
}

/* ---------- 回答エリア ---------- */
function renderDock() {
  if (!S) return;
  if (S.phase === "compose") return renderComposeDock();
  const st = stepOf(S.cur);
  if (!st) { dock(""); return; }
  const rest = remainingSteps().length;
  const canExit = S.done.includes("text1") && st.kind !== "login" && rest > 0;
  // 上：あと N つ・ここまでで投稿文をつくる（選択肢と一緒にスクロール）／下：とばす・次へ（いつも見える位置に固定）
  const top = S.done.includes("text1") && st.kind !== "login"
    ? `<div class="dock-top"><span>あと${rest}つ・とばしてもOK</span>${canExit ? `<button type="button" class="lnk" id="dExit">ここまでで投稿文をつくる</button>` : ""}</div>` : "";
  const skipBtn = `<button type="button" class="btn ghost sm" id="dSkip">とばす</button>`;
  const okBtn = (on, n) => `<button type="button" class="btn wide" id="dOk" ${on ? "" : "disabled"}>次へ${n ? `（${n}）` : ""}</button>`;
  let html = "", act = "";

    html = loginHtml("はじめる") + (CONFIG.ALLOW_NO_LOGIN ? `<div class="row center"><button type="button" class="lnk" id="dNoLogin">ログインせずに使う（AI・記録なし）</button></div>` : "");
  } else if (st.kind === "photo") {
    html = `<div class="row"><button type="button" class="btn wide" id="dPhoto">${ICON.camera}写真をえらぶ</button><button type="button" class="btn ghost" id="dNoPhoto">写真なしで進む</button></div><div class="err" id="dErr"></div>`;
  } else if (st.kind === "text") {
    html = `<div class="inrow"><textarea class="input" id="dIn" rows="1" maxlength="${st.max}" placeholder="${esc(st.ph ? st.ph() : "")}" enterkeyhint="send"></textarea><button type="button" class="send" id="dSend" aria-label="送る" disabled>${ICON.send}</button></div>
      <div class="row">${st.required ? `<span class="hint" style="margin:0">ここは必ず書いてください（短くて大丈夫です）</span>` : skipBtn}<span class="cnt-sm" id="dCnt">0 / ${st.max}</span></div>`;
  } else if (st.kind === "who") {
    const sel = RT.who, it = sel ? item("who", sel.id) : null;
    html = `<div class="chips">${optionsOf(st).map(o => `<button type="button" class="chip${sel && sel.id === o.id ? " on" : ""}${o.free ? " sub" : ""}" data-id="${o.id}" aria-pressed="${!!(sel && sel.id === o.id)}">${sel && sel.id === o.id ? '<span class="ck">✓</span>' : ""}${esc(o.label)}</button>`).join("")}</div>
      ${it && (it.ph || it.free) ? `<div class="lab">${it.free ? "だれと一緒でしたか？" : "どんな人でしたか？（わかる範囲で・名前は書かなくてOK）"}</div><input class="input sm" id="dDetail" maxlength="${CONFIG.MAX_DETAIL}" placeholder="${esc(it.free ? "例：サークルの仲間" : it.ph)}" value="${esc(it.free ? (sel.label === it.label ? "" : sel.label) : (sel.detail || ""))}" enterkeyhint="done" />` : ""}`;
    act = `<div class="row">${skipBtn}${okBtn(!!sel)}</div>`;

function drawToDataUrl(src, w, h, edge, quality) {
  const k = Math.min(1, edge / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
/** 端末の画像ファイルをデコード（EXIF の向きを反映）。createImageBitmap で読めない形式は <img> で再試行 */
async function decodeFile(file) {
  if ("createImageBitmap" in window) {
    try { const b = await createImageBitmap(file, { imageOrientation: "from-image" }); return { el: b, w: b.width, h: b.height, close: () => b.close && b.close() }; }
    catch (e) { /* <img> で再試行 */ }
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode error")); i.src = url; });
    return { el: img, w: img.naturalWidth, h: img.naturalHeight, close: () => URL.revokeObjectURL(url) };
  } catch (e) { URL.revokeObjectURL(url); throw e; }
}

/* =====================================================================
   ヒント：ひとことを送った直後に裏で 1 回だけ AI を呼ぶ（待たない）

async function fireHint() {

  const g = RT.gen, sid = S.sid, t0 = now();
  RT.hintBusy = true;
  S.hint = { status: "待ち" }; save();
  try {
    if (!getToken(CONFIG.KEYS.TOKEN) && !await autoLogin()) { S.hint = { status: "ログインなし" }; save(); return; }
    const body = { action: "hint", variant: "chat", token: getToken(CONFIG.KEYS.TOKEN), context: { event: CONFIG.EVENT, sample_total: SAMPLES.length }, target: { text: S.ans.text1 } };
    if (PHOTO.imgAi) body.target.image_data = PHOTO.imgAi;
    const res = await post(body, CONFIG.GAS_URL);
    if (g !== RT.gen || !S || S.sid !== sid) return;
    const sec = Math.round((now() - t0) / 100) / 10;
    S.hint = res.ok && res.result ? { status: "OK", cached: !!res.cached, elapsed_sec: sec, ...res.result } : { status: res.code || "ERROR", message: res.message || "", elapsed_sec: sec };

function composeText() {
  const A = S.ans, lines = [];
  const t1raw = String(A.text1 || "");
  String(t1raw).split(/\n/).map(s => s.replace(/[。．]+$/g, "").trim()).filter(Boolean).slice(0, 3).forEach(l => lines.push(l));
  const w = whoItem();
  if (w && w.line) { const l = w.line(A.who.detail, A.who.label); if (l) lines.push(l); }
  const f = firstFeel();
  const t1HasFeel = f && f.key ? new RegExp(f.key).test(t1raw) : false;
  const whys = A.why.map(x => { const it = item("why", x.id); return it && !it.free && it.say ? it.say : x.label; }).filter(Boolean).slice(0, 2).join("と");
  const fill = (tpl, e) => String(tpl || "").replace("{e}", e).replace("{v}", f ? f.v : "");
  if (whys) lines.push(t1HasFeel ? (f.negative ? `気になったのは${whys}` : `とくに${whys}！`) : f && f.withE ? fill(f.withE, whys) : `${whys}がよかった`);
  else if (f && !t1HasFeel && f.ex) lines.push(fill(f.ex, ""));
  // 2 番目以降に選んだ気持ち（ひとことに無いもの）を 1 つ
  const f2 = A.feel.map(x => ({ ...item("feel", x.id), v: x.label })).find(x => x && x.id !== (f && f.id) && !x.neutral && !(x.key && new RegExp(x.key).test(t1raw)));
  if (f2 && f2.ex) lines.push(String(f2.ex).replace("{v}", f2.v));
  A.next.forEach(n => { const it = item("next", n.id); if (!it || it.neutral) return; const s = it.free ? n.label : it.say; if (s) lines.push(s.replace("{v}", n.label)); });
  return uniq(lines.map(s => s.trim()).filter(Boolean)).slice(0, 6).join("\n");
}
function autoTags() {
  const t = [];

  S.ans.why.forEach(x => { const it = item("why", x.id); if (it && it.tag) t.push(it.tag); });

const gasOn = () => !!CONFIG.GAS_URL && /^https:\/\//.test(CONFIG.GAS_URL);
const logOn = () => !!CONFIG.LOG_URL && /^https:\/\//.test(CONFIG.LOG_URL);

function getToken(key) { const t = LS.get(key, null); if (t && t.token && t.exp > now() + 30000) return t.token; LS.del(key); return null; }
function setToken(token, sec, key) { LS.set(key, { token, exp: now() + sec * 1000 }); }
const hasTokens = () => (!gasOn() || !!getToken(CONFIG.KEYS.TOKEN)) && (!logOn() || !!getToken(CONFIG.KEYS.LOG_TOKEN));

/* 名前・パスワードはこの端末に保存（パスワードは平文で localStorage に入る点に注意。メニューのログアウトで削除） */
function getCreds() { const n = getName(), pw = LS.get(CONFIG.KEYS.PW, ""); return n && pw ? { name: n, pw } : null; }
async function post(body, url) {
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    // text/plain で送るとプリフライトが発生せず GAS でも CORS エラーにならない
    const res = await fetch(url, { method: "POST", redirect: "follow", signal: ctrl.signal, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    if (e.name === "AbortError") return { ok: false, code: "TIMEOUT", message: `応答がありませんでした（${CONFIG.TIMEOUT_MS / 1000} 秒）` };
    return { ok: false, code: "NETWORK", message: "接続できませんでした（" + e.message + "）" };
  } finally { clearTimeout(to); }
}
async function doLogin(name, pw) {
  const [a, b] = await Promise.all([
    gasOn() ? post({ action: "login", name, password: pw }, CONFIG.GAS_URL) : Promise.resolve(null),
    logOn() ? post({ action: "login", name, password: pw }, CONFIG.LOG_URL) : Promise.resolve(null)
  ]);
  if (a && !a.ok) return { ok: false, code: a.code, message: a.message || "認証に失敗しました" };
  if (b && !b.ok) return { ok: false, code: b.code, message: "記録用の認証に失敗しました：" + (b.message || "不明なエラー") };
  if (a) setToken(a.token, a.expires_in, CONFIG.KEYS.TOKEN);
  if (b) setToken(b.token, b.expires_in, CONFIG.KEYS.LOG_TOKEN);
  LS.set(CONFIG.KEYS.NAME, name); LS.set(CONFIG.KEYS.PW, pw);
  syncMenu();
  return { ok: true };
}
async function autoLogin() {
  const c = getCreds(); if (!c) return false;
  const r = await doLogin(c.name, c.pw);
  if (!r.ok && r.code === "AUTH") LS.del(CONFIG.KEYS.PW);

}

function qaList() {

/* =====================================================================
   記録（分析用。gas/DROP_COACH_LOG.gs v7 が列に展開する）
   - ノード：「層:タグ」（コンテンツ＝話題・どこが／人＝だれと・どこが／空間／感情＝気持ち／意向＝このあと）
   - ソフト分類：選んだ答えの重み（V の w × 選んだ順の重み）を足して合計 1 にしたもの
   - 気持ちの向き：選んだ気持ちの val を、選んだ順の重みで平均（-1〜1）
   - コーチ関与：ひとことのみ／選択あり／AI仕上げ（効果測定で分けて扱う）
===================================================================== */
function weighted(list, kind) {
  const ws = list.map((_, i) => (ORDER_W[kind] || [])[i] ?? .3), sum = ws.reduce((a, b) => a + b, 0) || 1;
  return list.map((x, i) => ({ id: x.id, label: x.label, src: x.src || "", pre: !!x.pre, w: r2(ws[i] / sum), ...(kind === "feel" ? { val: (item("feel", x.id) || {}).val ?? null } : {}) }));
}
function softOf() {
  const A = S.ans, raw = { c1: 0, c2: 0, c3: 0, att: 0 };
  const add = (kind, id, k) => { const it = item(kind, id); if (!it || !it.w) return; Object.keys(it.w).forEach(d => { raw[d] += it.w[d] * k; }); };
  if (A.who) add("who", A.who.id, 1);
  A.why.forEach((x, i) => add("why", x.id, ORDER_W.why[i] ?? .3));
  A.feel.forEach((x, i) => add("feel", x.id, ORDER_W.feel[i] ?? .3));
  A.next.forEach((x, i) => add("next", x.id, ORDER_W.next[i] ?? .6));
  const tot = Object.values(raw).reduce((a, b) => a + b, 0), share = {};
  Object.keys(raw).forEach(k => { share[k] = tot ? r2(raw[k] / tot) : 0; raw[k] = r2(raw[k]); });
  return { share, raw, total: r2(tot) };
}
function valenceOf() {
  let s = 0, w = 0;
  S.ans.feel.forEach((x, i) => { const v = (item("feel", x.id) || {}).val; if (typeof v !== "number") return; const k = ORDER_W.feel[i] ?? .3; s += v * k; w += k; });
  return w ? r2(s / w) : null;
}
function nodesOf() {
  const A = S.ans, n = [], subj = subjectOf();
  if (subj) n.push("コンテンツ:" + subj);
  if (A.who) n.push("人:" + (A.who.id === "other" ? "その他" : A.who.label));
  A.why.forEach(x => { const it = item("why", x.id); n.push((it ? it.layer : "コンテンツ") + ":" + x.label); });
  A.feel.forEach(x => n.push("感情:" + x.label));
  A.next.forEach(x => n.push("意向:" + x.label));
  return uniq(n);
}
function coachLevel() {
  if (S.aiOk && S.chosen === "AI") return "AI仕上げ";
  return ["who", "why", "feel", "next"].some(id => S.done.includes(id) && !S.skipped.includes(id)) ? "選択あり" : "ひとことのみ";
}
function buildRecord(end) {
  const A = S.ans, soft = softOf(), stepSec = {};
  Object.keys(S.times).forEach(k => { const t = S.times[k]; if (t.answered && t.shown) stepSec[k] = r2((t.answered - t.shown) / 1000); });
  const lastAsked = S.asked.filter(id => id !== "login").slice(-1)[0] || "";
  const h = S.hint || {};
  return {
    schema: "drop_chat_v3", app_version: APP_VERSION, session_id: S.sid, end,
    started_at: S.started, ended_at: new Date().toISOString(), duration_sec: r2((now() - S.t0) / 1000),
    answered: answeredCount(),
    last_step: S.phase === "compose" ? (S.early ? "途中で投稿文へ（" + stepName(lastAsked) + "）" : "最後まで") : stepName(lastAsked),
    early: S.early, has_photo: hasPhoto(),
    text1: A.text1,
    detected: { ...S.det, feel_labels: S.det.feels.map(id => (item("feel", id) || {}).label || id), who_label: S.det.who ? item("who", S.det.who).label : "" },
    subject: subjectOf(),
    answers: {
      who: A.who ? { id: A.who.id, label: A.who.label, detail: A.who.detail || "", pre: !!A.who.pre } : { id: "", label: "", detail: "" },
      why: weighted(A.why, "why"), feel: weighted(A.feel, "feel"), next: weighted(A.next, "next"),
      profile: A.profile || LS.get(CONFIG.KEYS.PROFILE, null) || { id: "", label: "" },
      score: A.score
    },
    valence: valenceOf(),
    skipped: S.skipped.slice(),
    hashtags: S.phase === "compose" ? activeTags() : [],
    nodes: nodesOf(), soft: soft.share, soft_raw: soft.raw, soft_total: soft.total,
    texts: { composed: S.composed, ai: S.aiText, final: S.phase === "compose" ? finalText() : "", chosen: S.chosen, edited: isEdited() },
    coach_level: coachLevel(),
    ai: S.ai ? { status: S.ai.status, message: S.ai.message, cached: S.ai.cached, model: S.ai.model, prompt_version: S.ai.prompt_version, elapsed_sec: S.ai.elapsed_sec, result: S.ai.result } : { status: "" },
    hint: { status: h.status || "", elapsed_sec: h.elapsed_sec, cached: !!h.cached, subject: h.subject || "", why_options: h.why_options || [], act: h.act || "", photo_summary: h.photo_summary || "", covered: h.covered || null },
    example_views: S.exViews || [], preview_opens: S.previewOpens || 0,
    order: S.order, step_sec: stepSec, big_text: document.documentElement.classList.contains("big")
  };
}
async function sendLog(end) {

const hasTokensAny = () => !!(LS.get(CONFIG.KEYS.TOKEN, null) || LS.get(CONFIG.KEYS.LOG_TOKEN, null));
function syncMenu() { $("mLogout").hidden = !(getCreds() || hasTokensAny()); $("mBig").textContent = document.documentElement.classList.contains("big") ? "文字を標準にもどす" : "文字を大きく"; }
$("menuBtn").addEventListener("click", () => { const m = $("menu"); m.hidden = !m.hidden; $("menuBtn").setAttribute("aria-expanded", String(!m.hidden)); syncMenu(); });
const closeMenu = () => { $("menu").hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); };
$("mBig").addEventListener("click", () => { const b = !document.documentElement.classList.contains("big"); document.documentElement.classList.toggle("big", b); LS.set(CONFIG.KEYS.BIG, b); syncMenu(); syncDockH(); });
$("mExamples").addEventListener("click", () => { closeMenu(); openExamples(); });
$("mAbout").addEventListener("click", () => {
  closeMenu();
  openSheet("このチャットについて", `
    <p>DROP に投稿する文を、いくつかの問いに答えながら一緒につくるチャットです。問いはとばせますし、いつでも「ここまでで投稿文をつくる」で終われます。</p>
    <p><b>AI について：</b>写真とあなたの答えをもとに、AI が文を読みやすく整えます。あなたが書いていない出来事や気持ちは足さないようにしています。最後に「AI が整えた文」と「自分の言葉の文」から選べます。</p>
    <p><b>答えの使い道：</b>答えと投稿文は、CULTURE SNACK の効果を確かめる分析にだけ使います。投稿文は、あなたがコピーして DROP に投稿するまで公開されません。名前は分析画面にだけ表示されます。</p>
    <div class="row"><button type="button" class="btn full" id="shBack">もどる</button></div>`);
  $("shBack").addEventListener("click", closeModal);
});
$("mRestart").addEventListener("click", () => { closeMenu(); restart(); });
$("mProfile").addEventListener("click", () => {
  closeMenu(); LS.del(CONFIG.KEYS.PROFILE); toast("次の投稿のさいごに、もう一度聞きます");
  if (S && S.phase === "ask") { S.done = S.done.filter(x => x !== "profile"); renderProgress(); }
});
$("mLogout").addEventListener("click", () => { closeMenu(); [CONFIG.KEYS.TOKEN, CONFIG.KEYS.LOG_TOKEN, CONFIG.KEYS.PW].forEach(k => LS.del(k)); syncMenu(); toast("ログアウトしました（保存したパスワードも削除しました）"); });
async function restart() {
  if (S && !S.logged && S.ans.text1 && S.phase === "compose") sendLog("reset");
  closeModal(); start();
}

/* ---------- 起動 ---------- */
function warmLogin() { if (anyGas() && getCreds() && !hasTokens()) autoLogin().catch(() => {}); }
async function start() {
  RT.gen++; RT.typing = false; RT.typingText = "";
  SS.del(CONFIG.KEYS.PHOTO); PHOTO = { img: "", imgAi: "", w: 0, h: 0 };
  S = newSession(); RT.rendered = 0; RT.busy = true; RT.aiWait = false; RT.loginFor = null;
  save(); renderMsgs(); renderStaff(); lockDock(); warmLogin();
  const g = RT.gen;
  if (!await bot("こんにちは！ DROP の投稿文を、チャットで一緒につくります", { sub: "写真とひとことだけでもOK。あとはタップで答えるだけです" })) return;
  await advance(null, g);
}
function restore() {
  const s = LS.get(CONFIG.KEYS.SESSION, null);
  if (!s || s.v !== 30 || !s.sid || now() - (s.t0 || 0) > CONFIG.RESUME_HOURS * 3600e3 || s.copied) return false;
  S = s; S.msgs = (S.msgs || []).filter(m => m && m.who);
  const p = SS.get(CONFIG.KEYS.PHOTO, null);
  if (p && p.sid === S.sid && /^data:image\/jpeg;base64,/.test(p.img || "")) PHOTO = p;
  RT.rendered = S.msgs.length; renderMsgs(); renderStaff(); warmLogin();
  if (S.hint && S.hint.status === "待ち") { S.hint = null; if (S.ans.text1 && S.phase === "ask") fireHint(); }
  if (S.phase === "compose") {
    if (!S.msgs.some(m => m.card === "compose")) { lockDock(); finishCompose(false); return true; }
    renderComposeDock(); return true;
  }
  const st = stepOf(S.cur);
  if (!st || !applicable(st)) { lockDock(); advance(S.cur ? S.cur : null); return true; }
  if (st.opts) prepareOrder(st);
  setSelFromAns(st);
  RT.busy = false; renderDock();
  return true;
}
(async () => {
  $("staffFlag").hidden = !STAFF;
  if (LS.get(CONFIG.KEYS.BIG, false)) document.documentElement.classList.add("big");
  syncMenu();
  const json = await loadSamples();
  SAMPLES = (Array.isArray(json) ? json : (json.records || [])).map(r => ({
    id: r.artwork_id, n: r.account_name || "", s: String(r.sentence || "").trim(), img: r.image_file_path || r.image_file_path_thumbnail || ""
  })).filter(p => p.s);
  if (!restore()) start();
})();
</script>
</body>
</html>
