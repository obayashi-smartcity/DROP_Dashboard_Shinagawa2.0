<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>DROP. Coach — チャット版（V2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f5f9; --bg-b:#ecebf1; --card:#fff;
    --stroke:#dcd9e3; --stroke-soft:#ebe9f0;
    --text:#1d1b22; --muted:#5d5a66; --dim:#96939e;
    --rich:#7a58b0; --rich-2:#a98cd0; --rich-soft:#efe9f7; --rich-ink:#5b3f8a;
    --mine:#e7f4ec; --mine-ink:#2f6b4a;
    --warn:#9a6b00; --warn-soft:#fbf3dc; --err:#b3372a; --err-soft:#fbeaea;
    --font:"Inter","Noto Sans JP",system-ui,-apple-system,sans-serif;
    --dockH:140px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,textarea{font-family:var(--font)}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  svg{flex:none}

  /* ---------- App bar ---------- */
  .appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--stroke-soft)}
  .appbar-in{max-width:640px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:14px}
  .brand{font-weight:900;font-size:18px;letter-spacing:-.4px;line-height:1;white-space:nowrap}
  .brand i{font-style:normal;color:var(--rich)}
  .brand small{display:block;font-size:9.5px;font-weight:800;letter-spacing:2px;color:var(--dim);margin-top:4px}
  .prog{flex:1;height:5px;background:var(--bg-b);border-radius:3px;overflow:hidden}
  .prog span{display:block;height:100%;width:0;background:var(--rich);border-radius:3px;transition:width .35s ease}
  .icon-btn{width:38px;height:38px;border:1px solid var(--stroke);background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .icon-btn svg{width:18px;height:18px}
  .menu{max-width:640px;margin:0 auto;padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .menu button{border:1px solid var(--stroke);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
  .menu button:hover{color:var(--text);border-color:var(--rich-2)}
  .staff-flag{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--warn);padding:3px 7px;border-radius:4px}

  /* ---------- Chat ---------- */
  .chat{max-width:640px;margin:0 auto;padding:14px 14px calc(var(--dockH) + 28px)}
  .msg{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
  .msg.me{justify-content:flex-end}
  .msg.new{animation:pop .28s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--text);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.5px}
  .avatar i{font-style:normal;color:var(--rich-2)}
  .avatar.ai{background:var(--rich)}
  .bubble{max-width:82%;padding:10px 14px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;border-radius:4px 18px 18px 18px;background:#fff;border:1px solid var(--stroke-soft)}
  .msg.me .bubble{background:var(--rich);border-color:var(--rich);color:#fff;border-radius:18px 4px 18px 18px}
  .msg.me .bubble.muted{background:var(--bg-b);border-color:var(--bg-b);color:var(--muted);font-size:13.5px}
  .msg.me .bubble.photo{padding:0;overflow:hidden;max-width:62%;background:var(--bg-b);border-color:var(--stroke-soft);border-radius:18px 4px 18px 18px}
  .msg.me .bubble.photo img{display:block;width:100%;max-height:340px;object-fit:cover}
  .msg.me .bubble.photo .nophoto{display:block;padding:16px 18px;color:var(--muted);font-size:13px}
  .bubble .sub{display:block;margin-top:4px;font-size:12px;color:var(--dim);white-space:normal}
  .typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px}
  .typing .bubble i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.1s infinite}
  .typing .bubble i:nth-child(2){animation-delay:.15s}.typing .bubble i:nth-child(3){animation-delay:.3s}
  .typing .bubble em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:8px}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* ---------- Cards in chat ---------- */
  .card{background:#fff;border:1.5px solid var(--rich);border-radius:18px;padding:14px 14px 12px;width:100%;max-width:82%}
  .card-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .card-hd b{font-size:13px;letter-spacing:.5px;color:var(--rich-ink)}
  .card-hd .cnt{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .card-photo{display:block;width:40px;height:40px;object-fit:cover;border-radius:8px}
  .card textarea{display:block;width:100%;border:1px dashed transparent;border-radius:10px;resize:none;font-size:16px;line-height:1.75;min-height:120px;outline:none;padding:4px 6px;margin:0 -6px;color:var(--text);background:none}
  .card textarea:focus{border-color:var(--rich-2);background:#fcfbfe}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;clear:both}
  .tag{border:1.5px solid var(--rich-2);background:var(--rich-soft);color:var(--rich-ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
  .tag.off{background:#fff;border-color:var(--stroke);color:var(--dim);text-decoration:line-through}
  .tags-hint{font-size:11.5px;color:var(--dim);margin-top:6px}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:8px;cursor:pointer;user-select:none}
  .switch input{width:16px;height:16px;accent-color:var(--rich)}
  .card.ai{border-color:var(--rich-2);background:#fcfbfe}
  .card.ai p{margin:0;white-space:pre-wrap;font-size:15.5px;line-height:1.75}
  .card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .using{font-size:12px;font-weight:800;color:var(--mine-ink);background:var(--mine);padding:5px 10px;border-radius:999px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:8px}
  .note.warn{color:var(--warn)}
  .card.staff{border-color:var(--warn);border-style:dashed;max-width:100%}
  .card.staff b{color:var(--warn)}
  .card.staff table{width:100%;border-collapse:collapse;font-size:12.5px}
  .card.staff td{border-top:1px solid var(--stroke-soft);padding:5px 4px;vertical-align:top}
  .card.staff td:first-child{color:var(--dim);white-space:nowrap;width:1%}
  .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
  .bars s{display:block;height:8px;background:var(--bg-b);border-radius:4px;overflow:hidden;text-decoration:none}
  .bars s u{display:block;height:100%;background:var(--rich)}
  .card.staff pre{max-height:240px;overflow:auto;background:var(--bg);padding:8px;font-size:11px;border-radius:8px;white-space:pre-wrap;word-break:break-all}

  /* ---------- Dock (answer area) ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--stroke-soft);box-shadow:0 -10px 30px -22px rgba(60,40,100,.45)}
  .dock-in{max-width:640px;margin:0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  body.editing .dock{display:none}
  .dock-q{font-size:12px;font-weight:700;color:var(--dim);margin:0 0 8px;display:flex;gap:8px;align-items:center}
  .dock-q b{color:var(--rich)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:42px;padding:8px 15px;border:1.5px solid var(--stroke);border-radius:999px;background:#fff;font-size:14.5px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--rich-soft);border-color:var(--rich);color:var(--rich-ink)}
  .chip .ord{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--rich);color:#fff;font-size:11.5px;font-weight:800;align-items:center;justify-content:center}
  .chip.sub{color:var(--muted);border-style:dashed}
  .chip.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .row.center{justify-content:center}
  .row.between{justify-content:space-between}
  .btn{min-height:46px;padding:0 20px;border:none;border-radius:999px;background:var(--rich);color:#fff;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn svg{width:18px;height:18px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--rich-ink);border:1.5px solid var(--rich-2)}
  .btn.sm{min-height:38px;padding:0 14px;font-size:13.5px}
  .btn.wide{flex:1}
  .lnk{background:none;border:none;color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 4px;min-height:36px}
  .lnk.strong{color:var(--rich);font-weight:800}
  .inrow{display:flex;gap:8px;align-items:flex-end}
  .input{flex:1;min-height:46px;max-height:140px;border:1.5px solid var(--stroke);border-radius:23px;padding:11px 16px;font-size:16px;line-height:1.45;outline:none;resize:none;background:#fff;color:var(--text)}
  .input:focus{border-color:var(--rich)}
  .send{width:46px;height:46px;border-radius:50%;border:none;background:var(--rich);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .send:disabled{opacity:.35}
  .send svg{width:20px;height:20px}
  .cnt-sm{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto}
  .scale{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .scale button{height:46px;border-radius:12px;border:1.5px solid var(--stroke);background:#fff;font-weight:800;font-size:15px;color:var(--text);padding:0}
  .scale button:active,.scale button.on{background:var(--rich);border-color:var(--rich);color:#fff}
  .scale-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:5px;padding:0 2px}
  .exit{display:flex;justify-content:center;margin-top:6px}
  .login{display:grid;gap:8px}
  .login .input{border-radius:12px}
  .err{font-size:13px;color:var(--err);min-height:1em}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:var(--muted);min-height:46px}
  .spin{width:18px;height:18px;border:2.5px solid var(--rich-soft);border-top-color:var(--rich);border-radius:50%;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}

  /* ---------- Toast / Modal ---------- */
  .toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:var(--text);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,30,.55);display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .sheet-hd b{font-size:16px}
  .sheet-hd .icon-btn{margin-left:auto}
  .sheet p.lead{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
  .samples{display:grid;grid-template-columns:1fr;gap:10px}
  .sample{display:flex;gap:12px;border:1px solid var(--stroke-soft);border-radius:14px;padding:10px;background:#fff}
  .sample img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:var(--bg-b)}
  .sample b{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px;font-weight:700}
  .sample p{margin:0;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
  @media (min-width:700px){ .samples{grid-template-columns:1fr 1fr} .modal{align-items:center} .sheet{border-radius:20px;max-height:84vh} }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">DROP<i>.</i> Coach<small>CHAT · V2</small></div>
    <div class="prog" aria-hidden="true"><span id="progBar"></span></div>
    <span class="staff-flag" id="staffFlag" hidden>STAFF</span>
    <button type="button" class="icon-btn" id="menuBtn" aria-label="メニュー" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <nav class="menu" id="menu" hidden>
    <button type="button" id="mRestart">最初からやり直す</button>
    <button type="button" id="mSamples">見本の投稿を見る</button>
    <button type="button" id="mProfile">「あなたについて」を答え直す</button>
    <button type="button" id="mLogout" hidden>ログアウト</button>
  </nav>
</header>

<main class="chat" id="chat" aria-live="polite">
  <div id="msgs"></div>
  <div id="after"></div>
</main>

<footer class="dock" id="dock"><div class="dock-in" id="dockIn"></div></footer>
<input type="file" id="file" accept="image/*" hidden />
<div class="toast" id="toast" role="status"></div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet-hd"><b id="modalTitle">見本の投稿（運営作成・架空）</b><button type="button" class="icon-btn" id="modalX" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="lead">書き方の参考です。言い回しはまねせず、あなたの言葉で大丈夫です。</p>
    <div class="samples" id="sampleList"></div>
  </div>
</div>

/* ---------- 状態 ---------- */

/* =====================================================================

const topFeel = () => {

const STEPS = [
  { id: "login", kind: "login", count: false,

  { id: "elem", kind: "multi", opts: "elem", max: 3, when: () => !!topFeel(),

];
const stepOf = id => STEPS.find(s => s.id === id);
const applicable = st => !st.when || st.when();
function nextStepAfter(id) {
  const i = id ? STEPS.findIndex(s => s.id === id) : -1;
  for (let k = i + 1; k < STEPS.length; k++) { const st = STEPS[k]; if (!S.done.includes(st.id) && applicable(st)) return st; }
  return null;
}
function remainingSteps() { return STEPS.filter(st => !S.done.includes(st.id) && st.kind !== "login" && applicable(st)); }
function answeredCount() { return S.done.filter(id => { const st = stepOf(id); return st && st.count !== false && !S.skipped.includes(id); }).length; }

/* ---------- 表示 ---------- */
function renderMsgs() {

function bot(text, extra = {}) {
  const g = RT.gen;

    setTimeout(() => {
      if (g !== RT.gen) return res(false);   // 「最初から」が押されたら前のセッションには書かない
      RT.typing = false; S.msgs.push({ who: "bot", text, ...extra }); renderMsgs(); save(); res(true);
    }, CONFIG.BOT_DELAY);

}
function me(text, extra = {}) { S.msgs.push({ who: "me", text, ...extra }); renderMsgs(); save(); }
let toastTimer = null;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800); }
function dock(html) { $("dockIn").innerHTML = html; syncDockH(); }
function lockDock() { RT.busy = true; dock(`<div class="wait"><span class="spin"></span></div>`); }

if ("ResizeObserver" in window) new ResizeObserver(syncDockH).observe($("dock"));

/* =====================================================================
   チャットの進行
===================================================================== */
async function ask(st) {
  const g = RT.gen;
  S.cur = st.id; S.phase = "ask";
  if (!S.asked.includes(st.id)) S.asked.push(st.id);
  S.times[st.id] = { shown: now() };
  if (st.opts) prepareOrder(st);
  RT.multi = st.kind === "multi" ? (S.ans[st.id] || []).map(x => ({ ...x })) : [];
  RT.free = null;
  await bot(st.q());
  if (g !== RT.gen) return;
  RT.busy = false;
  renderDock(); save();
}
async function advance(fromId, g = RT.gen) {
  if (g !== RT.gen) return;
  const n = nextStepAfter(fromId);
  if (n) await ask(n); else await toCompose(false);
}
function markDone(st) {
  if (!S.done.includes(st.id)) S.done.push(st.id);
  const t = S.times[st.id]; if (t) t.answered = now();
}
async function answered(st, display, extra) {
  markDone(st); S.skipped = S.skipped.filter(x => x !== st.id);
  if (display != null) me(display, extra);
  lockDock();
  await advance(st.id);
}
async function skipStep(st) {
  if (RT.busy) return;
  if (st.id === "profile") LS.set(CONFIG.KEYS.PROFILE, { id: "none", label: "答えない" });   // 答えたくない人には次から聞かない
  if (!S.skipped.includes(st.id)) S.skipped.push(st.id);
  markDone(st); me("とばす", { muted: true }); lockDock();
  await advance(st.id);
}
async function exitEarly() {
  if (RT.busy) return;
  S.early = true; me("ここで投稿文にする", { muted: true }); lockDock();
  await toCompose(true);
}
/** 選択肢の表示順（シャッフル。末尾固定の項目はそのまま）。一度決めた順は保存して使い回す */
function prepareOrder(st) {
  if (S.order[st.id]) return;
  const list = V[st.opts];
  const body = list.filter(x => !x.fixed), tail = list.filter(x => x.fixed);
  S.order[st.id] = (CONFIG.SHUFFLE ? shuffle(body) : body).concat(tail).map(x => x.id);
}
function optionsOf(st) { return (S.order[st.id] || V[st.opts].map(x => x.id)).map(id => item(st.opts, id)).filter(Boolean); }

/* ---------- 回答エリア ---------- */
function renderDock() {
  if (!S) return;

  const skipHtml = `<button type="button" class="lnk" id="dSkip">とばす</button>`;

      <div class="scale-lab"><span>1 いまいち</span><span>5 ふつう</span><span>10 最高</span></div><div class="row">${skipHtml}</div>${exitHtml}`;
  } else if (st.kind === "single") {

      ${freeHtml()}<div class="row">${st.id === "profile" ? `<button type="button" class="lnk" id="dSkip">答えない</button>` : skipHtml}</div>${exitHtml}`;

      }).join("")}</div>
      ${freeHtml()}
      <div class="row between">${skipHtml}<span class="hint" id="dMax">${st.max ? `${st.max}つまで` : ""}</span><button type="button" class="btn sm" id="dOk" ${sel.length ? "" : "disabled"}>これでOK${sel.length ? `（${sel.length}）` : ""}</button></div>${exitHtml}`;
  }
  dock(html);
  bindDock(st);
}
function freeHtml() {
  if (!RT.free) return "";
  return `<div class="inrow" style="margin-top:10px"><input class="input" id="dFree" maxlength="${CONFIG.MAX_FREE}" placeholder="自分の言葉で（${CONFIG.MAX_FREE}字まで）" enterkeyhint="done" /><button type="button" class="send" id="dFreeOk" aria-label="決定">${ICON.send}</button></div>`;
}
function loginHtml(label) {
  return `<form class="login" id="dLogin" autocomplete="on">
    <input class="input" id="lName" name="username" autocomplete="nickname" maxlength="40" placeholder="名前（ニックネームでOK）" value="${esc(getName())}" />
    <input class="input" id="lPw" name="password" type="password" autocomplete="current-password" placeholder="パスワード（運営からお知らせしたもの）" />
    <div class="err" id="lErr"></div>
    <button type="submit" class="btn" id="lGo">${esc(label)}</button>
  </form>`;
}
function bindDock(st) {
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  on("dSkip", () => skipStep(st));
  on("dExit", exitEarly);
  if (st.kind === "login") {
    bindLogin(async () => { markDone(st); me("ログインしました", { muted: true }); lockDock(); await advance(st.id); });
    on("dNoLogin", async () => { if (RT.busy) return; S.noLogin = true; markDone(st); me("ログインせずに使う", { muted: true }); lockDock(); await advance(st.id); });
  }
  if (st.kind === "photo") {
    on("dPhoto", () => $("file").click());
    on("dNoPhoto", async () => { if (RT.busy) return; S.skipped.push("photo"); markDone(st); me("写真なしで進む", { muted: true }); lockDock(); await advance(st.id); });
  }
  if (st.kind === "text") {
    const ta = $("dIn"), send = $("dSend");
    const sync = () => { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; send.disabled = !ta.value.trim(); $("dCnt").textContent = `${ta.value.length} / ${st.max}`; syncDockH(); };
    ta.addEventListener("input", sync);
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !(st.multiline && matchMedia("(pointer:coarse)").matches)) { e.preventDefault(); send.click(); } });
    send.addEventListener("click", async () => {
      if (RT.busy) return;
      const v = st.multiline ? ta.value.replace(/\r\n?/g, "\n").replace(/\n{2,}/g, "\n").trim() : oneLine(ta.value);
      if (!v) return;
      if (st.id === "text1") S.ans.text1 = v.slice(0, st.max);
      if (st.id === "whoDetail") S.ans.whoDetail = v.slice(0, st.max);
      await answered(st, v);
    });
    if (st.id === "text1" && S.ans.text1) { ta.value = S.ans.text1; sync(); }
    if (!matchMedia("(pointer:coarse)").matches) ta.focus();
  }
  if (st.kind === "scale") {
    $("dockIn").querySelectorAll(".scale button").forEach(b => b.addEventListener("click", async () => {
      if (RT.busy) return;
      S.ans.mood = Number(b.dataset.v);
      b.classList.add("on");
      await answered(st, `気分 ${S.ans.mood}`);
    }));
  }
  if (st.kind === "single") {
    $("dockIn").querySelectorAll(".chip").forEach(b => b.addEventListener("click", async () => {
      if (RT.busy) return;
      const o = item(st.opts, b.dataset.id);
      if (o.free) { RT.free = { step: st.id }; renderDock(); const f = $("dFree"); if (f) f.focus(); return; }
      await pickSingle(st, o, o.label);
    }));
    bindFree(st, async v => pickSingle(st, item(st.opts, "other"), v));
  }
  if (st.kind === "multi") {
    $("dockIn").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      if (RT.busy) return;
      const o = item(st.opts, b.dataset.id);
      const k = RT.multi.findIndex(x => x.id === o.id);
      if (k >= 0) { RT.multi.splice(k, 1); renderDock(); return; }
      if (st.max && RT.multi.length >= st.max) { b.classList.add("shake"); const m = $("dMax"); if (m) m.style.color = "var(--err)"; setTimeout(() => b.classList.remove("shake"), 320); return; }
      if (o.free) { RT.free = { step: st.id }; renderDock(); const f = $("dFree"); if (f) f.focus(); return; }
      // 「とくにない」「ふつう」は他と同時に選べない
      if (o.neutral) RT.multi = [];
      else RT.multi = RT.multi.filter(x => !(item(st.opts, x.id) || {}).neutral);
      RT.multi.push({ id: o.id, label: o.label });
      renderDock();
    }));
    bindFree(st, v => {
      if (st.max && RT.multi.length >= st.max) return;
      RT.multi = RT.multi.filter(x => x.id !== "other" && !(item(st.opts, x.id) || {}).neutral);
      RT.multi.push({ id: "other", label: st.id === "feel" ? "#" + v.replace(/^[#＃]/, "") : v });
      RT.free = null; renderDock();
    });
    on("dOk", async () => {
      if (RT.busy || !RT.multi.length) return;
      S.ans[st.id] = RT.multi.map(x => ({ ...x }));
      if (st.id === "feel") { const tf = topFeel(); if (!tf) S.ans.elem = []; }
      await answered(st, RT.multi.map(x => x.label).join("　"));
    });
  }
}
function bindFree(st, done) {
  const f = $("dFree"), ok = $("dFreeOk");
  if (!f) return;
  const go = () => { const v = oneLine(f.value).slice(0, CONFIG.MAX_FREE); if (!v) { f.focus(); return; } done(v); };
  ok.addEventListener("click", go);
  f.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); go(); } });
}
async function pickSingle(st, o, label) {
  const v = { id: o.id, label };
  if (st.id === "act") S.ans.act = v;
  if (st.id === "who") {
    const changed = !S.ans.who || S.ans.who.id !== o.id;
    S.ans.who = v;
    if (changed) { S.ans.whoDetail = ""; S.done = S.done.filter(x => x !== "whoDetail"); S.skipped = S.skipped.filter(x => x !== "whoDetail"); }
  }
  if (st.id === "profile") { S.ans.profile = v; LS.set(CONFIG.KEYS.PROFILE, v); }
  await answered(st, label);
}

/* ---------- 写真 ---------- */
function drawToDataUrl(src, w, h, edge, quality) {
  const k = Math.min(1, edge / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", quality);
}
/** 端末の画像ファイルをデコード（EXIF の向きを反映）。createImageBitmap で読めない形式は <img> で再試行 */
async function decodeFile(file) {
  if ("createImageBitmap" in window) {
    try { const b = await createImageBitmap(file, { imageOrientation: "from-image" }); return { el: b, w: b.width, h: b.height, close: () => b.close && b.close() }; }
    catch (e) { /* <img> で再試行 */ }
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode error")); i.src = url; });
    return { el: img, w: img.naturalWidth, h: img.naturalHeight, close: () => URL.revokeObjectURL(url) };
  } catch (e) { URL.revokeObjectURL(url); throw e; }
}
$("file").addEventListener("change", async () => {
  const file = $("file").files && $("file").files[0];
  $("file").value = "";
  if (!file || !S || S.cur !== "photo" || RT.busy) return;
  const err = m => { const el = $("dErr"); if (el) el.textContent = m; };
  if (file.type && !/^image\//.test(file.type)) { err("画像ファイルを選んでください"); return; }
  if (file.size > CONFIG.MAX_MB * 1024 * 1024) { err(`画像が大きすぎます（${CONFIG.MAX_MB}MB まで）`); return; }
  lockDock();
  try {
    const src = await decodeFile(file);
    try {
      if (!src.w || !src.h) throw new Error("empty image");

/* =====================================================================
   投稿文の組み立て（画面内・即時。AI は使わない）
   行の役割の目安：見た（ひとこと）→ 誰と → 気づき（どこが＋気持ち）→ 次の一歩。ハッシュタグは別に付ける
   ※ 選んでいない気持ち・出来事は足さない（選択肢の言葉を短い言い回しにするだけ）
===================================================================== */
function composeText() {
  const A = S.ans, lines = [];
  const t1 = String(A.text1 || "").split(/\n/).map(s => s.replace(/[。．]+$/g, "").trim()).filter(Boolean).slice(0, 3);
  const tf = topFeel();
  const w = whoItem();
  const whoLine = w && w.line ? w.line(A.whoDetail, A.act && A.act.id, S.ans.who && S.ans.who.label) : "";
  const elems = A.elem.map(e => { const it = item("elem", e.id); if (whoLine && it && it.layer === "人" && it.id !== "gap") return ""; return it && it.free ? e.label : (it ? it.say : ""); }).filter(Boolean).slice(0, 2);
  const ePhrase = elems.join("と");
  const fill = (tpl, e) => String(tpl || "").replace("{e}", e).replace("{v}", plainLabel(tf ? tf.v : ""));
  const act = A.act ? item("act", A.act.id) : null;
  const t1Has = tf && tf.key ? new RegExp(tf.key).test(A.text1 || "") : false;
  let whyDone = false;
  if (t1.length) lines.push(...t1);
  else if (tf && ePhrase) { lines.push(fill(tf.withE, ePhrase)); whyDone = true; }
  else if (tf) { lines.push(fill(tf.ex, "")); whyDone = true; }
  else if (act && act.solo) lines.push(act.solo);
  else if (A.act && act && act.free) lines.push(A.act.label);
  if (whoLine) lines.push(whoLine);
  if (!whyDone && tf) {
    if (ePhrase) lines.push(t1Has ? `とくに${ePhrase}！` : fill(tf.withE, ePhrase));
    else if (!t1Has) lines.push(fill(tf.ex, ""));
  }
  A.next.forEach(n => { const it = item("next", n.id); if (!it || it.neutral) return; const s = it.free ? n.label : it.say; if (s) lines.push(s.replace("{v}", n.label)); });
  return uniq(lines.map(s => s.trim()).filter(Boolean)).slice(0, 6).join("\n");
}
/** 投稿に付けるハッシュタグ（気持ちのタグ → 要素のタグの順。中立・ネガティブは付けない） */
function autoTags() {
  const t = [];
  S.ans.feel.forEach(f => { const it = item("feel", f.id); if (!it || it.neutral || it.negative) return; if (it.tag) t.push(it.tag); else if (it.free && /^#\S{1,12}$/.test(f.label)) t.push(f.label); });
  S.ans.elem.forEach(e => { const it = item("elem", e.id); if (it && it.tag) t.push(it.tag); });
  return uniq(t).slice(0, CONFIG.MAX_TAGS).concat(CONFIG.FIXED_TAGS || []);
}
const activeTags = () => (S.tagsOn ? autoTags().filter(t => !S.tagOff.includes(t)) : []);
function finalText() {
  const body = String(S.final || "").replace(/\r\n?/g, "\n").trim();
  const tags = activeTags();
  return (body + (tags.length ? "\n" + tags.join(" ") : "")).trim();
}
async function toCompose(early) {

    : (early ? "ここまでの答えで投稿文を作りました。" : "投稿文ができました。") + "そのまま使っても、自由に直してもOKです";
  await bot(lead, {});

}

/* =====================================================================
   AI 仕上げ（V2 仕上げ用 GAS → Azure OpenAI）。1 セッション 1 回だけ
===================================================================== */
const gasOn = () => !!CONFIG.GAS_URL && /^https:\/\//.test(CONFIG.GAS_URL);
const logOn = () => !!CONFIG.LOG_URL && /^https:\/\//.test(CONFIG.LOG_URL);
const anyGas = () => gasOn() || logOn();
function getToken(key) {
  const t = LS.get(key, null);
  if (t && t.token && t.exp > now() + 30000) return t.token;
  LS.del(key); return null;
}
function setToken(token, sec, key) { LS.set(key, { token, exp: now() + sec * 1000 }); }
const hasTokens = () => (!gasOn() || !!getToken(CONFIG.KEYS.TOKEN)) && (!logOn() || !!getToken(CONFIG.KEYS.LOG_TOKEN));
const getName = () => LS.get(CONFIG.KEYS.NAME, "") || "";
/* Name・パスワードはこの端末に保存（パスワードは平文で localStorage に入る点に注意。メニューのログアウトで削除） */
function getCreds() { const n = getName(), pw = LS.get(CONFIG.KEYS.PW, ""); return n && pw ? { name: n, pw } : null; }
async function post(body, url) {
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    // text/plain で送るとプリフライトが発生せず GAS でも CORS エラーにならない
    const res = await fetch(url, { method: "POST", redirect: "follow", signal: ctrl.signal, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    if (e.name === "AbortError") return { ok: false, code: "TIMEOUT", message: `応答がありませんでした（${CONFIG.TIMEOUT_MS / 1000} 秒）` };
    return { ok: false, code: "NETWORK", message: "接続できませんでした（" + e.message + "）" };
  } finally { clearTimeout(to); }
}
async function doLogin(name, pw) {
  const [a, b] = await Promise.all([
    gasOn() ? post({ action: "login", name, password: pw }, CONFIG.GAS_URL) : Promise.resolve(null),
    logOn() ? post({ action: "login", name, password: pw }, CONFIG.LOG_URL) : Promise.resolve(null)
  ]);
  if (a && !a.ok) return { ok: false, code: a.code, message: a.message || "認証に失敗しました" };
  if (b && !b.ok) return { ok: false, code: b.code, message: "記録用の認証に失敗しました：" + (b.message || "不明なエラー") };
  if (a) setToken(a.token, a.expires_in, CONFIG.KEYS.TOKEN);
  if (b) setToken(b.token, b.expires_in, CONFIG.KEYS.LOG_TOKEN);
  LS.set(CONFIG.KEYS.NAME, name); LS.set(CONFIG.KEYS.PW, pw);
  syncMenu();
  return { ok: true };
}
async function autoLogin() {
  const c = getCreds(); if (!c) return false;
  const r = await doLogin(c.name, c.pw);
  if (!r.ok && r.code === "AUTH") LS.del(CONFIG.KEYS.PW);
  return r.ok;
}

}
function qaList() {
  const A = S.ans, out = [];
  const q = id => stepOf(id).q();
  const ok = id => S.done.includes(id) && !S.skipped.includes(id);
  if (ok("act") && A.act) out.push({ q: q("act"), a: A.act.label });
  if (ok("feel") && A.feel.length) out.push({ q: "どんな気持ちになりましたか？（選んだ順）", a: A.feel.map(f => plainLabel(f.label)).join("、") });
  if (ok("elem") && A.elem.length && topFeel()) out.push({ q: q("elem"), a: A.elem.map(e => e.label).join("、") });
  if (ok("who") && A.who) out.push({ q: q("who"), a: A.who.label + (A.whoDetail ? `（${A.whoDetail}）` : "") });
  if (ok("next") && A.next.length) out.push({ q: q("next"), a: A.next.map(n => n.label).join("、") });

/* =====================================================================
   記録（分析用）
   - ノード：「層:タグ」。共起ネットワークにそのまま使う（行動／感情／コンテンツ・人・空間／人／意向）
   - ソフト分類：選んだタグの重み（V の w × 選んだ順の重み）を足して、合計 1 にしたもの
   - コーチ関与：ひとことのみ／選択あり／AI 仕上げ（効果測定で分けて扱う）
===================================================================== */
function weighted(list, kind) {
  const ws = list.map((_, i) => (ORDER_W[kind] || [])[i] ?? .3);
  const sum = ws.reduce((a, b) => a + b, 0) || 1;
  return list.map((x, i) => ({ id: x.id, label: plainLabel(x.label), w: r2(ws[i] / sum) }));
}
function softOf() {
  const A = S.ans, raw = { c1: 0, c2: 0, c3: 0, att: 0 };
  const add = (kind, id, k) => { const it = item(kind, id); if (!it || !it.w) return; Object.keys(it.w).forEach(d => { raw[d] += it.w[d] * k; }); };
  if (A.act) add("act", A.act.id, 1);
  A.feel.forEach((f, i) => add("feel", f.id, ORDER_W.feel[i] ?? .3));
  A.elem.forEach((e, i) => add("elem", e.id, ORDER_W.elem[i] ?? .3));
  if (A.who) add("who", A.who.id, 1);
  A.next.forEach((n, i) => add("next", n.id, ORDER_W.next[i] ?? .6));
  const tot = Object.values(raw).reduce((a, b) => a + b, 0);
  const share = {}; Object.keys(raw).forEach(k => { share[k] = tot ? r2(raw[k] / tot) : 0; raw[k] = r2(raw[k]); });
  return { share, raw, total: r2(tot) };
}
function nodesOf() {
  const A = S.ans, n = [];
  if (A.act) n.push({ layer: "行動", label: A.act.label });
  A.feel.forEach(f => n.push({ layer: "感情", label: plainLabel(f.label) }));
  A.elem.forEach(e => { const it = item("elem", e.id); n.push({ layer: it ? it.layer : "コンテンツ", label: e.label }); });
  if (A.who) n.push({ layer: "人", label: A.who.label });
  A.next.forEach(x => n.push({ layer: "意向", label: x.label }));
  return n;
}
function coachLevel() {
  if (S.aiUsed && S.chosen === "AI") return "AI仕上げ";
  const chips = ["act", "feel", "elem", "who", "next"].some(id => S.done.includes(id) && !S.skipped.includes(id));
  return chips ? "選択あり" : "ひとことのみ";
}
function buildRecord(end) {
  const A = S.ans, soft = softOf();
  const stepSec = {};
  Object.keys(S.times).forEach(k => { const t = S.times[k]; if (t.answered && t.shown) stepSec[k] = r2((t.answered - t.shown) / 1000); });
  const lastAsked = S.asked.filter(id => id !== "login").slice(-1)[0] || "";
  return {
    schema: "drop_chat_v2", app_version: APP_VERSION, session_id: S.sid, end,
    started_at: S.started, ended_at: new Date().toISOString(), duration_sec: r2((now() - S.t0) / 1000),
    answered: answeredCount(), asked: S.asked.filter(id => { const st = stepOf(id); return st && st.count !== false; }).length,
    last_step: S.phase === "compose" ? (S.early ? "途中で投稿文へ（" + lastAsked + "）" : "最後まで") : lastAsked,
    early: S.early, has_photo: !!(S.done.includes("photo") && !S.skipped.includes("photo")),
    answers: {
      text1: A.text1, mood: A.mood,
      act: A.act ? [{ id: A.act.id, label: A.act.label }] : [],
      feel: weighted(A.feel, "feel"), elem: weighted(A.elem, "elem"),
      who: A.who ? { id: A.who.id, label: A.who.label, detail: A.whoDetail } : { id: "", label: "", detail: "" },
      next: weighted(A.next, "next"),
      profile: A.profile || LS.get(CONFIG.KEYS.PROFILE, null) || { id: "", label: "" }
    },
    skipped: S.skipped.slice(),
    hashtags: S.phase === "compose" ? activeTags() : [],
    nodes: nodesOf().map(x => x.layer + ":" + x.label),
    soft: soft.share, soft_raw: soft.raw, soft_total: soft.total,
    texts: { composed: S.composed, ai: S.aiText, final: S.phase === "compose" ? finalText() : "", chosen: S.chosen, edited: !!S.edited },
    coach_level: coachLevel(),
    ai: S.ai ? { status: S.ai.status, message: S.ai.message, cached: S.ai.cached, model: S.ai.model, prompt_version: S.ai.prompt_version, elapsed_sec: S.ai.elapsed_sec, result: S.ai.result } : { status: "" },
    order: S.order, step_sec: stepSec
  };
}
async function sendLog(end) {
  if (!S) return;
  const rec = buildRecord(end);
  if (STAFF) pushHistory(rec);
  if (!logOn()) return;
  if (end === "copy" && S.loggedText === rec.texts.final) return;   // 同じ文面は送り直さない
  let tok = getToken(CONFIG.KEYS.LOG_TOKEN);
  if (!tok && await autoLogin()) tok = getToken(CONFIG.KEYS.LOG_TOKEN);
  if (!tok) return;
  let r = await post({ action: "log", token: tok, session: rec }, CONFIG.LOG_URL);
  if (!r.ok && r.code === "AUTH") {
    LS.del(CONFIG.KEYS.LOG_TOKEN);
    if (await autoLogin()) r = await post({ action: "log", token: getToken(CONFIG.KEYS.LOG_TOKEN), session: rec }, CONFIG.LOG_URL);
  }
  if (r.ok) { S.logged = true; S.loggedText = rec.texts.final; save(); console.info("記録しました", r); }
  else console.warn("記録できませんでした", r);
  renderStaff();
}
/* 画面を閉じた・別のページに移ったとき：答えが 1 つ以上あって未記録なら「途中離脱」として送る */
window.addEventListener("pagehide", () => {
  if (!S || S.logged || S.abandonSent || answeredCount() < 1 || !logOn()) return;
  const tok = getToken(CONFIG.KEYS.LOG_TOKEN); if (!tok) return;
  try {
    const body = JSON.stringify({ action: "log", token: tok, session: buildRecord("abandon") });
    if (navigator.sendBeacon(CONFIG.LOG_URL, new Blob([body], { type: "text/plain;charset=utf-8" }))) { S.abandonSent = true; save(); }
  } catch (e) {}
});

/* ---------- スタッフ用（?staff=1） ---------- */
function pushHistory(rec) {
  const h = LS.get(CONFIG.KEYS.HISTORY, []);
  const i = h.findIndex(x => x.session_id === rec.session_id);
  if (i >= 0) h[i] = rec; else h.push(rec);
  LS.set(CONFIG.KEYS.HISTORY, h.slice(-300));
}
function renderStaff() {
  const box = $("after");
  if (!STAFF || !S || S.phase !== "compose") { box.innerHTML = ""; return; }
  const rec = buildRecord("preview"), s = rec.soft;
  const n = LS.get(CONFIG.KEYS.HISTORY, []).length;
  box.innerHTML = `<div class="card staff">
    <div class="card-hd"><b>分析用の記録（スタッフ用）</b><span class="cnt">${esc(rec.coach_level)}・${rec.answered}問・${Math.round(rec.duration_sec)}秒</span></div>
    <table>
      <tr><td>気分</td><td>${rec.answers.mood ?? "−"}</td></tr>
      <tr><td>ノード</td><td>${esc(rec.nodes.join("｜") || "−")}</td></tr>
      <tr><td>気持ちの重み</td><td>${esc(rec.answers.feel.map(f => `${f.label} ${f.w}`).join("、") || "−")}</td></tr>
      <tr><td>ソフト分類</td><td><div class="bars">${Object.keys(SOFT_LABEL).map(k => `<span>${SOFT_LABEL[k]}</span><s><u style="width:${Math.round(s[k] * 100)}%"></u></s><span>${s[k].toFixed(2)}</span>`).join("")}</div></td></tr>
      ${rec.ai.status === "OK" && rec.ai.result ? `<tr><td>AI 判定</td><td>${esc((rec.ai.result.category || {}).label || "")}／${esc(rec.ai.result.w5h || "")}／評価 ${esc(rec.ai.result.level || "")}</td></tr>` : ""}
      <tr><td>記録</td><td>${logOn() ? (S.logged ? "送信済み" : "コピーしたときに送信") : "LOG_URL 未設定（この端末にだけ保存）"}</td></tr>
    </table>
    <details style="margin-top:8px"><summary style="font-size:12.5px;cursor:pointer">記録 JSON</summary><pre>${esc(JSON.stringify(rec, null, 1))}</pre></details>
    <div class="acts"><button type="button" class="btn sm ghost" id="sJson">JSON をコピー</button><button type="button" class="btn sm ghost" id="sCsv">この端末の記録を CSV で保存（${n}件）</button></div>
  </div>`;
  $("sJson").addEventListener("click", async () => { try { await navigator.clipboard.writeText(JSON.stringify(rec)); toast("コピーしました"); } catch (e) { toast("コピーできませんでした"); } });
  $("sCsv").addEventListener("click", downloadCsv);
}
function downloadCsv() {
  const h = LS.get(CONFIG.KEYS.HISTORY, []);
  if (!h.length) { toast("まだ記録がありません（コピーすると保存されます）"); return; }
  const cols = [
    ["セッションID", r => r.session_id], ["開始", r => r.started_at], ["終了", r => r.end], ["所要秒", r => r.duration_sec], ["回答数", r => r.answered],
    ["写真", r => (r.has_photo ? "あり" : "なし")], ["最初のひとこと", r => r.answers.text1], ["気分", r => r.answers.mood ?? ""],
    ["した", r => r.answers.act.map(x => x.label).join("、")], ["よかった", r => r.answers.feel.map(x => x.label).join(" > ")],
    ["どこが", r => r.answers.elem.map(x => x.label).join("、")], ["だれと", r => r.answers.who.label], ["どんな人", r => r.answers.who.detail],
    ["このあと", r => r.answers.next.map(x => x.label).join("、")], ["属性", r => (r.answers.profile || {}).label || ""],
    ["ハッシュタグ", r => r.hashtags.join(" ")], ["ノード", r => r.nodes.join("｜")],
    ["ソフト①", r => r.soft.c1], ["ソフト②", r => r.soft.c2], ["ソフト③", r => r.soft.c3], ["ソフト愛着", r => r.soft.att],
    ["最終文面", r => r.texts.final], ["採用", r => r.texts.chosen], ["手で編集", r => (r.texts.edited ? "あり" : "なし")], ["コーチ関与", r => r.coach_level],
    ["AI分類", r => (r.ai.result && r.ai.result.category ? r.ai.result.category.label : "")]
  ];
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = "﻿" + [cols.map(c => c[0]).join(","), ...h.map(r => cols.map(c => cell(c[1](r))).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `drop_chat_v2_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 見本・メニュー ---------- */
async function loadSamples() {
  for (const s of CONFIG.DATA_SOURCES) {
    try { const r = await fetch(s, { cache: "no-cache" }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    catch (e) { /* 次へ */ }
  }
  // file:// で直接開いたときなど fetch できないときは、HTML 内の控え（#sampleFallback）を使う
  try { return JSON.parse($("sampleFallback").textContent); } catch (e) { return { records: [] }; }
}
function openSamples() {
  $("sampleList").innerHTML = SAMPLES.length ? SAMPLES.map(p => `<div class="sample">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ""}<div><b>${esc(p.n.replace(/^運営作成\s*/, ""))}</b><p>${esc(p.s)}</p></div></div>`).join("") : '<p class="lead">見本を読み込めませんでした</p>';
  $("modal").classList.add("show"); $("modal").setAttribute("aria-hidden", "false");
}
function closeModal() { $("modal").classList.remove("show"); $("modal").setAttribute("aria-hidden", "true"); }
$("modalX").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function syncMenu() { $("mLogout").hidden = !(getCreds() || hasTokensAny()); }
const hasTokensAny = () => !!(LS.get(CONFIG.KEYS.TOKEN, null) || LS.get(CONFIG.KEYS.LOG_TOKEN, null));
$("menuBtn").addEventListener("click", () => { const m = $("menu"); m.hidden = !m.hidden; $("menuBtn").setAttribute("aria-expanded", String(!m.hidden)); syncMenu(); });
const closeMenu = () => { $("menu").hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); };
$("mRestart").addEventListener("click", () => { closeMenu(); restart(); });
$("mSamples").addEventListener("click", () => { closeMenu(); openSamples(); });
$("mProfile").addEventListener("click", () => {
  closeMenu(); LS.del(CONFIG.KEYS.PROFILE); toast("次の投稿のさいごに、もう一度聞きます");
  if (S && S.phase === "ask") { S.done = S.done.filter(x => x !== "profile"); renderProgress(); }
});
$("mLogout").addEventListener("click", () => {
  closeMenu(); [CONFIG.KEYS.TOKEN, CONFIG.KEYS.LOG_TOKEN, CONFIG.KEYS.PW].forEach(k => LS.del(k)); syncMenu(); toast("ログアウトしました（保存したパスワードも削除しました）");
});
async function restart() {
  if (S && !S.logged && answeredCount() >= 1 && S.phase === "compose") sendLog("reset");
  start();
}

/* ---------- 起動 ---------- */
async function start() {
  RT.gen++; RT.typing = false; RT.typingText = "";
  SS.del(CONFIG.KEYS.PHOTO); PHOTO = { img: "", imgAi: "", w: 0, h: 0 };   // 写真は前のセッションのものを持ち越さない
  S = newSession(); RT.rendered = 0; RT.busy = true; RT.aiWait = false; RT.loginFor = null;
  save(); renderMsgs(); renderStaff(); lockDock();
  warmLogin();
  const g = RT.gen;
  if (!await bot("こんにちは！ DROP の投稿文を、チャットで一緒に作ります")) return;
  if (!await bot("写真とひとことだけでもOK。あとはタップで答えるだけで、いつでも投稿文にできます")) return;
  await advance(null, g);
}
/** 保存した名前・パスワードがあり、トークンが切れていれば裏でログインしておく（途中離脱の記録に必要） */
function warmLogin() { if (anyGas() && getCreds() && !hasTokens()) autoLogin().catch(() => {}); }
function restore() {
  const s = LS.get(CONFIG.KEYS.SESSION, null);
  if (!s || s.v !== 2 || !s.sid || now() - (s.t0 || 0) > CONFIG.RESUME_HOURS * 3600e3) return false;
  if (s.copied && s.logged) return false;   // 投稿まで終わったセッションは新しく始める
  S = s; S.msgs = (S.msgs || []).filter(m => m && m.who);
  const p = SS.get(CONFIG.KEYS.PHOTO, null);
  if (p && p.sid === S.sid && /^data:image\/jpeg;base64,/.test(p.img || "")) PHOTO = p;
  RT.rendered = S.msgs.length; renderMsgs(); renderStaff(); warmLogin();
  if (S.phase === "compose") { renderComposeDock(); return true; }
  const st = stepOf(S.cur);
  if (!st || !applicable(st)) { lockDock(); advance(S.cur ? S.cur : null); return true; }
  if (st.opts) prepareOrder(st);
  RT.multi = st.kind === "multi" ? (S.ans[st.id] || []).map(x => ({ ...x })) : [];
  RT.busy = false; renderDock();
  return true;
}
(async () => {
  $("staffFlag").hidden = !STAFF;
  syncMenu();
  const json = await loadSamples();
  SAMPLES = (Array.isArray(json) ? json : (json.records || [])).map(r => ({
    id: r.artwork_id, n: r.account_name || "", s: String(r.sentence || "").trim(),
    img: r.image_file_path || r.image_file_path_thumbnail || ""
  })).filter(p => p.s);
  if (!restore()) start();
})();
</script>
